StylesPath = .vale/styles
MinAlertLevel = suggestion

# Base package; NVIDIA-specific rules live in .vale/styles/NVIDIA
Packages = Microsoft

Vocab = NVIDIA

[*.rst]
BasedOnStyles = Vale, Microsoft, NVIDIA

# Skip inline Sphinx roles (:class:`...`, :const:`...`, etc.) and Sphinx
# directive lines (.. automodule:: ...), which rst2html leaves as text.
TokenIgnores = (:[a-zA-Z:]+:`[^`]+`_?)
BlockIgnores = (?m)^\.\. [a-zA-Z:]+::[^\n]*(?:\n[ \t]+[^\n]*)*

# Formal technical docs avoid contractions (see NVIDIA.Contractions, which
# enforces the opposite of Microsoft's marketing-friendly preference).
Microsoft.Contractions = NO

# House style uses title-case headings and allows acronyms in headings
# (e.g. "Core API"), per tech-writer-reviewed docs.
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
