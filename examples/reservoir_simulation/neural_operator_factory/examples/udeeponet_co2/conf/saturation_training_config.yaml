# =============================================================================
# U-DeepONet — Gas Saturation (CO2 Sequestration)
# =============================================================================
# Width = 64 (from model_config.yaml, no override needed).
# Expected test-set results (paper Table 4a):
#   MPE = 0.0158,  MAE = 0.0146,  R² = 0.985
# =============================================================================

defaults:
  - model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/udeeponet_co2/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  data_path: /data/co2
  variable: saturation
  input_file: null
  output_file: null
  normalize: false
  num_workers: 4
  val_metric: mpe
  mask_enabled: true
  mask_channel: 0
  denormalize_fn: null

training:
  batch_size: 4
  epochs: 100
  initial_lr: 0.0007
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  use_amp: false
  resume_from_checkpoint: null
  regime: full_mapping

optimizer:
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 10
  gamma: 0.85

logging:
  use_mlflow: false
  experiment_name: udeeponet_co2_saturation

seed: 42

compute:
  benchmark: true
  deterministic: false
