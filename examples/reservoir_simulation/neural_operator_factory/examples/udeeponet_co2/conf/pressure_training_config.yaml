# =============================================================================
# U-DeepONet — Pressure Buildup (CO2 Sequestration)
# =============================================================================
# Width = 96 (overrides model_config.yaml default of 64).
# Expected test-set results (paper Table 4b):
#   MRE = 0.0072,  MAE = 0.64,  R² = 0.994
# =============================================================================

defaults:
  - model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/udeeponet_co2/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Override width from 64 to 96, and UNet activation from sin to relu
arch:
  xdeeponet:
    width: 96
    branch1:
      encoder:
        activation_fn: relu
      layers:
        activation_fn: relu
    trunk:
      hidden_width: 96
    decoder_width: 96

data:
  data_path: /data/co2
  variable: pressure
  input_file: null
  output_file: null
  normalize: false
  num_workers: 4
  val_metric: mre
  mask_enabled: true
  mask_channel: 0
  denormalize_fn: null

training:
  batch_size: 4
  epochs: 140
  initial_lr: 0.0006
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  use_amp: false
  resume_from_checkpoint: null
  regime: full_mapping

optimizer:
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 10
  gamma: 0.85

logging:
  use_mlflow: false
  experiment_name: udeeponet_co2_pressure

seed: 42

compute:
  benchmark: true
  deterministic: false
