# =============================================================================
# U-DeepONet — Model Configuration (CO2 Sequestration)
# =============================================================================
# U-Net enhanced DeepONet: 3 U-Net blocks in the branch, sinusoidal
# trunk for time encoding.  No Fourier layers.  Full-mapping regime
# (predict entire trajectory in a single forward pass).
#
# Default width p=64 (saturation).
# Pressure overrides to p=96 in pressure_training_config.yaml.
#
# Reference: Diab & Al Kobaisi (2024), Sci. Rep. 14, 21298.
#            https://doi.org/10.1038/s41598-024-72393-0
# =============================================================================

arch:
  dimensions: 3d
  model: xdeeponet

  xdeeponet:
    variant: u_deeponet
    width: 64
    padding: 8

    # Branch: 3 U-Net blocks in series (no Fourier layers)
    branch1:
      encoder:
        type: linear
        activation_fn: sin
      layers:
        num_fourier_layers: 0
        num_unet_layers: 3
        num_conv_layers: 0
        modes1: 12
        modes2: 12
        kernel_size: 3
        dropout: 0.0
        unet_impl: custom
        activation_fn: sin
      internal_resolution: null

    # Trunk: 10-layer sinusoidal FNN processing time only
    # output_activation: true (default) — sin applied to output layer.
    # U-DeepONet uses activated trunk output, unlike TNO which uses linear.
    trunk:
      input_type: time
      hidden_width: 64
      num_layers: 10
      activation_fn: sin
      output_activation: true

    # Decoder: shallow MLP projection (per-timestep trunk query → 1)
    decoder_type: mlp
    decoder_width: 64
    decoder_layers: 1
    decoder_activation_fn: relu

# Relative L2 loss + spatial derivative regularization (dx)
loss:
  types: [relative_l2]
  weights: [1.0]

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.0
      use_cell_volumes: false
