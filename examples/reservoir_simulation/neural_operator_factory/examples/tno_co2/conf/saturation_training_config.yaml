# TNO — Gas Saturation (CO2), width p=96

defaults:
  - model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/tno_co2/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  data_path: /data/co2
  variable: saturation
  input_file: null
  output_file: null
  normalize: false
  num_workers: 4
  val_metric: mpe
  mask_enabled: false
  mask_channel: 0
  denormalize_fn: null
  num_timesteps: 16

training:
  batch_size: 4
  initial_lr: 0.0006
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  use_amp: false
  resume_from_checkpoint: null
  regime: autoregressive

  autoregressive:
    input_window: 1
    output_window: 3
    teacher_forcing_epochs: 90
    pushforward_epochs: 0
    rollout_epochs: 40
    max_unroll: 5
    noise_std: 0.0
    use_feedback_channel: false
    lr_reset_factor: 1.0
    rollout_mode: live_gradients

optimizer:
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 2
  gamma: 0.92

logging:
  use_mlflow: false
  experiment_name: tno_co2_saturation

seed: 42

compute:
  benchmark: true
  deterministic: false
