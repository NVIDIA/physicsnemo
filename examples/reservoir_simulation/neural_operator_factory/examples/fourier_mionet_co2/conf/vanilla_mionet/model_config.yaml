# =============================================================================
# Vanilla MIONet — Model Configuration (CO2 Sequestration)
# =============================================================================
# Two-branch MIONet: branch1 = spatial (minimal), branch2 = MLP
# for scalar inputs, trunk = sinusoidal FNN.  No Fourier layers.
# Paper reference R2: sat=0.948, pres=0.961
# =============================================================================

arch:
  dimensions: 3d
  model: xdeeponet

  xdeeponet:
    variant: mionet
    width: 36
    padding: 8

    branch1:
      encoder:
        type: linear
        activation_fn: relu
      layers:
        num_fourier_layers: 0
        num_unet_layers: 0
        num_conv_layers: 1
        modes1: 12
        modes2: 12
        kernel_size: 3
        dropout: 0.0
        unet_impl: custom
        activation_fn: relu
      internal_resolution: null

    branch2:
      encoder:
        type: mlp
        hidden_width: 36
        num_layers: 3
        activation_fn: relu
      layers:
        num_fourier_layers: 0
        num_unet_layers: 0
        num_conv_layers: 0

    trunk:
      input_type: time
      hidden_width: 36
      num_layers: 6
      activation_fn: sin
      output_activation: true

    decoder_type: mlp
    decoder_width: 36
    decoder_layers: 0
    decoder_activation_fn: relu

loss:
  types: [relative_l2]
  weights: [1.0]

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.0
      use_cell_volumes: false
