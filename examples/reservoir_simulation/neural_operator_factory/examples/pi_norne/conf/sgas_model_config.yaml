# =============================================================================
# PI-Norne — Gas Saturation (SGAS) Fourier-DeepONet Model Configuration
# =============================================================================
# 4D Fourier-DeepONet for gas saturation prediction on the Norne field.
# Branch: 6 Fourier layers (pure spectral processing)
# Trunk: 12-layer deep MLP for temporal encoding
# Feedback channel appends previous prediction as extra input.
#
# Norne grid: 46 x 112 x 22, 44,431 active cells (39.2%), 65 timesteps
# Input channels: 11 + 1 feedback = 12 during AR training
# Output: gas saturation (fraction, [0, 1])
# =============================================================================

arch:
  dimensions: 4d
  model: xdeeponet

  xdeeponet:
    variant: fourier_deeponet
    width: 64
    padding: 8

    # Branch1: 6 pure Fourier layers for spatial encoding
    branch1:
      encoder:
        type: linear
        activation_fn: gelu
      layers:
        num_fourier_layers: 6
        num_unet_layers: 0
        num_conv_layers: 0
        modes1: 10
        modes2: 10
        modes3: 6
        kernel_size: 3
        dropout: 0.0
        activation_fn: gelu

    # Trunk: 12-layer deep MLP for time coordinates
    trunk:
      input_type: time
      hidden_width: 128
      num_layers: 12
      activation_fn: tanh
      output_activation: false

    # Decoder: temporal projection for single-step output
    decoder_type: temporal_projection
    decoder_width: 64
    decoder_layers: 1
    decoder_activation_fn: relu

# =============================================================================
# SGAS Loss Configuration
# =============================================================================
loss:
  types: [l1]
  weights: [1.0]

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx, dy, dz]
    metric: null

  physics:
    mass_conservation:
      enabled: true
      weight: 0.5
      use_cell_volumes: true
      metric: null
