# PI-Norne — Water Saturation (Norne Field)

defaults:
  - swat_model_config
  - _self_

hydra:
  job:
    chdir: False
  run:
    dir: ./outputs/pi_norne/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  data_path: /data/norne
  variable: swat
  input_file: norne_{mode}_a.pt
  output_file: norne_{mode}_swat.pt
  normalize: false
  num_workers: 4
  val_metric: rmse
  mask_enabled: true
  mask_channel: null
  denormalize_fn: null
  num_timesteps: null

training:
  batch_size: 1
  initial_lr: 0.001
  checkpoint_dir: ./checkpoints
  validate_freq: 5
  use_amp: false
  resume_from_checkpoint: null
  regime: autoregressive

  autoregressive:
    input_window: 3
    output_window: 1
    teacher_forcing_epochs: 10
    pushforward_epochs: 0
    rollout_epochs: 90
    max_unroll: 5
    noise_std: 0.0
    use_feedback_channel: true
    lr_reset_factor: 1.0
    rollout_mode: detached

optimizer:
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: step
  step_size: 10
  gamma: 0.85

logging:
  use_mlflow: false
  experiment_name: pi_norne_swat

seed: 42

compute:
  benchmark: true
  deterministic: false
