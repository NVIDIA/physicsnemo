# =============================================================================
# Conv-FNO — Model Configuration (CO2 Sequestration)
# =============================================================================
# 3 Fourier layers + 3 Conv-enhanced layers (Conv3d skip connections).
# Reference: Wen et al. (2022), arXiv:2109.03697, Table G.12 — ~31M params.
# =============================================================================

arch:
  dimensions: 3d
  model: xfno

  xfno:
    out_channels: 1
    width: 36
    padding: 8
    activation_fn: relu

    modes1: 10
    modes2: 10
    modes3: 10

    num_fno_layers: 3
    num_unet_layers: 0
    num_conv_layers: 3

    lifting_type: mlp
    lifting_layers: 1
    lifting_width: 36

    decoder_type: mlp
    decoder_layers: 1
    decoder_width: 128
    decoder_activation_fn: relu

    unet_type: custom
    unet_kernel_size: 3
    unet_dropout: 0.0
    conv_kernel_size: 3

loss:
  types: [relative_l2]
  weights: [1.0]

  derivative:
    enabled: true
    weight: 0.5
    dims: [dx]
    metric: null

  physics:
    mass_conservation:
      enabled: false
      weight: 0.0
      use_cell_volumes: false
