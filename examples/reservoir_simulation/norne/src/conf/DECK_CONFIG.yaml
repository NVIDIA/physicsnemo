# ║                                                                              ║
# ║         NVIDIA PHYSICS-INFORMED NEURAL OPERATOR RESERVOIR SIMULATION         ║
# ║                            CONFIGURATION DECK                                ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Overview
# --------
# This deck drives an end-to-end reservoir simulation workflow built on
# physics-informed neural operators (FNO / PINO / Transformer-based solvers).
# It governs three coupled stages:
#
#   1. Forward modelling   — surrogate operators that map static reservoir
#                            properties to dynamic state variables.
#   2. Inverse modelling   — ensemble-based history matching with optional
#                            DCT or VCAE parametrisation.
#   3. Uncertainty quant.  — ensemble propagation, localisation, and
#                            measurement-noise treatment.
#
# Conventions
# -----------
#   • Units are field units unless noted (psi, STB/day, mD, etc.).
#   • Boolean-style fields use the strings "Yes" / "No" (case-sensitive).
#   • Paths are resolved relative to the launch directory.
#
