# A warmup to training.optimizer.lr, then a cosine decay, one step per epoch
# (scheduler_update_mode: epoch). Both halves follow a half cosine. Select it from a
# model config with `defaults: [override /scheduler@training.scheduler:
# warmup_cosine]`, or with `scheduler@training.scheduler=warmup_cosine` on
# the CLI. The run starts at lr / div_factor and ends at
# lr / (div_factor * final_div_factor): 1e-6 at lr 3.75e-4.
#
# pct_start is the warmup's share of the run: 0.01 is 5 of the default 500
# epochs. Set it to 5 / training.num_epochs for another length. A warmup of
# exactly one step (pct_start * num_epochs == 1) makes OneCycleLR divide by
# zero.
_target_: torch.optim.lr_scheduler.OneCycleLR
max_lr: ${training.optimizer.lr}
total_steps: ${training.num_epochs}
pct_start: 0.01
div_factor: 5
final_div_factor: 75
anneal_strategy: cos
cycle_momentum: false
