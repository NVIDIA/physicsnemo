# DrivaerML surface dataset
# Point cloud mesh (no cells). Fields live in point_data.

name: drivaer_ml_surface

train_datadir: /Users/coreya/data/drivaer_ml_pnm_mesh
val_datadir: /Users/coreya/data/drivaer_ml_pnm_mesh

pipeline:
  reader:
    _target_: ${dp:MeshReader}
    path: ${train_datadir}
    pattern: "**/boundary*.vtp.pt"
  transforms:
    - _target_: ${dp:SetGlobalField}
      fields:
        inlet_velocity: [30.0, 0.0, 0.0]
    - _target_: ${dp:DropMeshFields}
      global_data: [TimeValue]
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
    - _target_: ${dp:RandomRotateMesh}
      axes: ["z"]
      transform_point_data: true
      transform_global_data: true
    - _target_: ${dp:RandomTranslateMesh}
      max_offset: [1.0, 1.0, 0.0]
    - _target_: ${dp:NonDimensionalizeFields}
      dimensional_field: pMeanTrim
      nondimensional_field: CpMeanTrim
      section: point_data
      target_fields: [wallShearStressMeanTrim]
    - _target_: ${dp:RenameMeshFields}
      point_data:
        CpMeanTrim: pressure
        wallShearStressMeanTrim: wss
    - _target_: ${dp:SubsampleMesh}
      n_points: 50000
    - _target_: ${dp:MeshToTensorDict}
    - _target_: ${dp:RestructureTensorDict}
      groups:
        input:
          points: points
          inlet_velocity: global_data.inlet_velocity
        output:
          pressure: point_data.pressure
          wss: point_data.wss

targets:
  pressure: scalar
  wss: vector

metrics: [l1, l2, mae]
