# Single-branch AB-UPT ablation; the inactive stream is not constructed.
input_type: tensors
output_type: tensordict
compile: false
sampling_resolution: 16384

dataset_reader_overrides:
  geometry_points: 65536
  num_supernodes: 16384
  num_volume_anchors: 16384
  volume_queries: ${sampling_resolution}

forward_kwargs:
  geometry: boundaries.abupt_geometry.points
  supernodes: boundaries.abupt_supernodes.points
  volume_anchors: boundaries.abupt_volume_anchors.points
  parameters: global_data.U_inf
  volume_queries: interior.points

model:
  _target_: ab_upt.ABUPTRecipe
  mode: volume
  hidden_dim: 192
  num_heads: 3
  num_interaction_blocks: 2
  num_shared_layers: 1
  num_decoder_layers: 6
  pooling_radius: 0.25
  pooling_chunk_size: 4096
  pooling_message_fp32: false
  query_chunk_size: 4096
  coordinate_scale: 1000.0
  radius_search_backend: null

training:
  optimizer:
    lr: 1.0e-4
