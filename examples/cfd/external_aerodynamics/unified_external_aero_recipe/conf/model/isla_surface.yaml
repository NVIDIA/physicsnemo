# ---------------------------------------------------------------------------
# ISLA (Invariant Slice Attention) -- surface task on DrivAerML.
# ---------------------------------------------------------------------------
# Pair with `dataset=drivaer_ml_surface`.
#
# ISLA is mesh-native, on GLOBE's contract (`input_type: mesh`,
# `output_type: mesh`): forward() takes the boundary as named Mesh objects
# and the case's global data, and returns a point-cloud Mesh whose point_data
# holds the output_schema fields. One case per call, no batch axis.
#
# The model reads the whole boundary of the flow domain: the vehicle and the
# tunnel's inlet, outlet, slip and no_slip boundaries, which each case file
# stores beside it. It predicts at the vehicle's cells only. From each
# boundary it reads the cell centroids, normals and measures, and it takes
# its length unit from them. The `dataset_*` blocks below adapt the samples
# for this model only, so the other models read the dataset as before.
defaults:
  - override /scheduler@training.scheduler: warmup_cosine

input_type: mesh
output_type: mesh

# The reader also loads the tunnel boundaries, whole up to
# `sampling_resolution` cells each (DrivAerML's have a few thousand). The
# dataset's transforms move them with the vehicle, and its terminal
# SurfaceMeshToDomainMesh keeps them beside `boundaries.vehicle`.
dataset_reader_overrides:
  domain_boundaries: [inlet, no_slip, outlet, slip]
# ISLA needs every boundary's normals to point into the fluid. The curated
# files store the tunnel boundaries that way and the vehicle with its normals
# into the body, so the vehicle is reversed, with its `normals` field.
# Remove this step (and `dataset_overrides`) if your files' vehicle already
# points into the fluid.
dataset_append_transforms:
  - _target_: ${dp:FlipBoundaryOrientation}
    boundaries: [vehicle]
    normal_fields: [normals]
# After the flip the vehicle's normals point out of the body: tell the force
# coefficients (src/forces.py).
dataset_overrides:
  surface_normals_point: outward

training:
  optimizer:
    lr: 3.75e-4   # ISLA trains at a lower rate than the recipe's 3e-3

# The model compiles its own blocks (model.compile_blocks below).
compile: false

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each
    vehicle: boundaries.vehicle       # the subsampled vehicle surface
    inlet: boundaries.inlet           # the tunnel's boundaries
    no_slip: boundaries.no_slip
    outlet: boundaries.outlet
    slip: boundaries.slip
  prediction_boundaries: {literal: [vehicle]}   # names, passed as they are
  global_data: global_data            # the model selects the leaves it declares

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    pressure: {rank: 0}
    wss: {rank: 1}
  boundary_schemas:              # the boundary conditions by name; none carries per-cell inputs
    vehicle: {}
    inlet: {}
    no_slip: {}
    outlet: {}
    slip: {}
  global_schema:
    U_inf: {rank: 1}             # the freestream velocity; the model reads its direction
  hidden: 512
  n_layers: 12
  n_slices: 128
  compile_blocks: true
