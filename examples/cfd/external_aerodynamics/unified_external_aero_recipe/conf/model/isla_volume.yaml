# ---------------------------------------------------------------------------
# ISLA (Invariant Slice Attention) -- interior task on DrivAerML.
# ---------------------------------------------------------------------------
# Pair with `dataset=drivaer_ml_volume`.
#
# The interior task (`interior: true`) predicts at `prediction_points`, the
# dataset's interior point cloud. The mesh contract is that of
# isla_surface.yaml. The model reads the whole boundary of the flow domain,
# every boundary mesh the case files store, each a boundary condition by its
# name: the vehicle and the tunnel's no_slip, slip, inlet and outlet
# boundaries. It takes them at full resolution and draws its own boundary
# tokens from their cells (`n_boundary_tokens`). It computes each prediction
# point's signed distance to that boundary itself, so it does not read the
# dataset's `sdf` and `sdf_normals`.
defaults:
  - override /scheduler@training.scheduler: warmup_cosine

input_type: mesh
output_type: mesh
sampling_resolution: 50000     # interior points per case, sized with n_boundary_tokens for an 80 GB GPU

dataset_reader_overrides:
  subsample_n_cells: null      # the boundaries are read whole
# ISLA needs every boundary's normals to point into the fluid. The curated
# files store the tunnel boundaries that way and the vehicle into the body,
# so the vehicle is reversed. Remove this step (and `dataset_overrides`) if
# your files' vehicle already points into the fluid.
dataset_append_transforms:
  - _target_: ${dp:FlipBoundaryOrientation}
    boundaries: [vehicle]
    normal_fields: [normals]   # negated with the winding, if the files store it
# After the flip the vehicle's normals point out of the body: tell the force
# coefficients (src/forces.py).
dataset_overrides:
  surface_normals_point: outward

training:
  optimizer:
    lr: 3.75e-4   # ISLA trains at a lower rate than the recipe's 3e-3

# The model compiles its own blocks (model.compile_blocks below).
compile: false

forward_kwargs:
  boundary_meshes:                    # Mesh[2, 3] each, at full resolution
    vehicle: boundaries.vehicle
    no_slip: boundaries.no_slip
    slip: boundaries.slip
    inlet: boundaries.inlet
    outlet: boundaries.outlet
  prediction_points: interior         # the interior point cloud
  global_data: global_data            # the model selects the leaves it declares

model:
  _target_: physicsnemo.experimental.models.isla.ISLA
  output_schema:                 # the dataset's targets, by name and tensor rank
    velocity: {rank: 1}
    pressure: {rank: 0}
    nut: {rank: 0}
  boundary_schemas:              # the boundary conditions by name; none carries per-cell inputs
    vehicle: {}
    no_slip: {}
    slip: {}
    inlet: {}
    outlet: {}
  global_schema:
    U_inf: {rank: 1}             # the freestream velocity; the model reads its direction
  interior: true                 # predict at prediction_points
  n_boundary_tokens: 100000      # boundary tokens drawn per case
  hidden: 512
  n_layers: 12
  n_slices: 128
  compile_blocks: true
