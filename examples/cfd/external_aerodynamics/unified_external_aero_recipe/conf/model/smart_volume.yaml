# Select dataset=drivaer_ml_smart_volume.
input_type: tensors
output_type: tensors
compile: false
# SMART conditioning is sensitive to the generic recipe's input and update scales.
precision: float32
training:
  optimizer:
    lr: 1.0e-3
  scheduler:
    step_size: 100
    gamma: 0.5
independent_validation: true
forward_kwargs:
  geometry: boundaries.smart_geometry.points
  queries: interior.points
  query_features:
  - interior.point_data.sdf
  - interior.point_data.sdf_normals
  parameters: global_data.U_inf
  geometry_seed: global_data.smart_geometry_seed
model:
  _target_: smart_model.SMARTField
  field: volume
  out_dim: ${out_dim}
  query_feature_channels: 4
  parameter_channels: 3
  parameter_scale: 30.0
  hidden_dim: 448
  num_heads: 8
  num_layers: 6
  num_latents: 2048
  geometry_subsample: 16384
  share_weights: false
  qk_normalization: true
  qk_temperature_max: 4.0
  eval_seed: 0
  eval_chunk_size: 8192
