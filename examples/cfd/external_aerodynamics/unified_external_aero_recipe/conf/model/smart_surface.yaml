# Select dataset=drivaer_ml_surface.
input_type: tensors
output_type: tensors
compile: false
precision: float32
training:
  loss_type: mse
  optimizer:
    lr: 1.0e-3
  scheduler:
    step_size: 100
    gamma: 0.5
dataloader:
  num_workers: 2
  prefetch_factor: 2
  num_streams: 2
forward_kwargs:
  geometry: interior.points
  queries: interior.points
  query_features: boundaries.vehicle.cell_data.normals
model:
  _target_: physicsnemo.experimental.models.smart.SMART
  field: surface
  out_dim: ${out_dim}
  query_feature_channels: 3
  # [12, 4.5, 3.25] m in L_ref units (DrivAerML L_ref = 5 m).
  coordinate_scale: [2.4, 0.9, 0.65]
  center_on_geometry: true
  hidden_dim: 448
  num_heads: 8
  num_layers: 6
  num_latents: 2048
  geometry_subsample: 16384
  share_weights: true
  qk_normalization: true
  qk_temperature_max: 4.0
  eval_seed: 0
  eval_chunk_size: 8192
