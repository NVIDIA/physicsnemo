# ---------------------------------------------------------------------------
# Universal cross-cutting defaults shared by train.yaml and infer.yaml.
# Anything truly training-only (num_epochs, optimizer.lr, scheduler)
# lives in train.yaml so the inference companion can stay clean of it;
# knobs both entry points need but with different values (output_dir,
# compile, sampling_resolution) are declared per entry point instead.
# ---------------------------------------------------------------------------

# -- Runtime knobs -----------------------------------------------------------
precision: "bfloat16"
profile: false
augment: false
benchmark_io: false

# -- Training fundamentals (the constants every loop needs, regardless
#     of schedule) -----------------------------------------------------------
training:
  seed: 42
  save_interval: 25
  loss_type: "huber"
  batch_size: 1
  scheduler_update_mode: "epoch"
  optimizer:
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

# -- DataLoader / Dataset Performance Tuning --------------------------------
dataloader:
  prefetch_factor: 4
  num_streams: 4
  use_streams: true
  num_workers: 4
  pin_memory: true
  # Optional two-tier reader cache (RAM + node-local disk). Removes the
  # repeated small/metadata reads that dominate per-sample latency on
  # network filesystems (Lustre): tensordict meta.json trees, global_data
  # scalars, extra-boundary globs. One instance is shared across all
  # datasets/splits; a shared disk_dir is safe across ranks on a node.
  # Enable with e.g.:
  #   cache:
  #     _target_: ${dp:DatasetCache}
  #     ram_bytes_limit: 4294967296          # 4 GiB; null disables RAM tier
  #     disk_dir: /raid/${oc.env:USER}/pn-datacache   # null disables disk tier
  #     disk_bytes_limit: 214748364800       # 200 GiB (soft target)
  #     eviction: largest                    # largest | fifo | lru
  # Disk entries persist across runs, so later runs on a node start warm.
  cache: null

# -- Logging -----------------------------------------------------------------
logging:
  log_every_n_steps: 10
