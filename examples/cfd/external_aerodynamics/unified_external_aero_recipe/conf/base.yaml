# ---------------------------------------------------------------------------
# Universal cross-cutting defaults shared by train.yaml and infer.yaml.
# Anything truly training-only (num_epochs, optimizer.lr, scheduler)
# lives in train.yaml so the inference companion can stay clean of it;
# knobs both entry points need but with different values (output_dir,
# compile, sampling_resolution) are declared per entry point instead.
# ---------------------------------------------------------------------------

# -- Runtime knobs -----------------------------------------------------------
precision: "bfloat16"
profile: false
augment: false
benchmark_io: false

# -- Training fundamentals (the constants every loop needs, regardless
#     of schedule) -----------------------------------------------------------
training:
  seed: 42
  save_interval: 25
  loss_type: "huber"
  batch_size: 1
  scheduler_update_mode: "epoch"
  optimizer:
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    eps: 1.0e-8

# -- DataLoader / Dataset Performance Tuning --------------------------------
dataloader:
  prefetch_factor: 4
  num_streams: 4
  use_streams: true
  num_workers: 4
  pin_memory: true
  # Optional reader cache (RAM + node-local disk) for the small metadata
  # reads every sample repeats: tensordict meta.json trees, global_data
  # scalars, extra-boundary globs. One instance is shared by every dataset
  # and split; ranks on a node may share the disk_dir. Bulk tensor data is
  # not cached. Enable with e.g.:
  #   cache:
  #     _target_: ${dp:DatasetCache}
  #     ram_bytes_limit: 4294967296          # 4 GiB per rank; null disables
  #     disk_dir: ${oc.env:TMPDIR,/tmp}/pn-datacache-${oc.env:USER}
  #     disk_bytes_limit: 214748364800       # 200 GiB, clamped to free space
  # disk_dir must be node-local (NVMe, tmpfs, $TMPDIR); network filesystems
  # are refused. Under /tmp the cache is usually gone after the job.
  cache: null

# -- Logging -----------------------------------------------------------------
logging:
  log_every_n_steps: 10
