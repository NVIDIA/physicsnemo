# CFD-only SMART variant. Geometry uses every available vehicle-cell centroid.
# Online per-layer geometry sampling is configured in model/smart_*.yaml;
# sampling_resolution below controls field queries only.
train_datadir: ${dataset_paths.drivaer_ml}
pipeline:
  augmentation_before: physicsnemo.experimental.datapipes.smart.SMARTInputs
  reader:
    _target_: physicsnemo.experimental.datapipes.smart.SMARTSurfaceReader
    path: ${train_datadir}
    pattern: run_*/*.pdmsh/_tensordict/boundaries/vehicle
    subsample_n_cells: null
    merge_global_data_from: ../../global_data
  augmentations:
    - _target_: ${dp:RandomRotateMesh}
      _convert_: all
      axes: ["z"]
      mode: axis_aligned
      transform_cell_data:
        wallShearStressMeanTrim: true
      transform_global_data:
        U_inf: true
    - _target_: ${dp:RandomTranslateMesh}
      distribution:
        _target_: torch.distributions.Uniform
        low:
          _target_: torch.tensor
          data: [-1.0, -1.0, 0.0]
        high:
          _target_: torch.tensor
          data: [1.0, 1.0, 0.0]
  transforms:
    - _target_: ${dp:DropMeshFields}
      global_data: [TimeValue]
    - _target_: physicsnemo.experimental.datapipes.smart.SMARTInputs
      field: surface
      coordinate_scale: [12.0, 4.5, 3.25]
      conditioning: [1.205, 30.0]
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        pMeanTrim: pressure
        wallShearStressMeanTrim: stress
      association: cell_data
    - _target_: ${dp:RenameMeshFields}
      cell_data:
        pMeanTrim: pressure
        wallShearStressMeanTrim: wss
    - _target_: ${dp:NormalizeMeshFields}
      association: cell_data
      eps: 0.0
      fields:
        pressure:
          type: scalar
          mean: -0.2843972522592281
          std: 0.25477916084022034
        wss:
          type: vector
          mean: [-0.0014902472648493541, 1.7990168638299372e-06, -8.717814674974937e-05]
          std: [0.0019502962838457926, 0.0012712102363446481, 0.0010463527655731398]
    - _target_: ${dp:ComputeSurfaceNormals}
      store_as: cell_data
      field_name: normals
    - _target_: physicsnemo.experimental.datapipes.smart.SMARTSurfaceMeshToDomainMesh
      interior_points: cell_centroids
      n_cells: ${sampling_resolution}
targets:
  pressure: scalar
  wss: vector
sampling_resolution: 200000
