# CFD-only SMART variant. Geometry uses every available vehicle-cell centroid.
# Online per-layer geometry sampling is configured in model/smart_*.yaml;
# sampling_resolution below controls field queries only.
train_datadir: ${dataset_paths.drivaer_ml}
pipeline:
  augmentation_before: ${dp:CaptureGeometry}
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: run_*/domain_*.pdmsh
    subsample_n_points: ${sampling_resolution}
    subsample_n_cells: null
    drop_interior_cells: true
    drop_in_file_boundaries: false
    boundary_subsample: cells
  augmentations:
    - _target_: ${dp:RandomRotateMesh}
      _convert_: all
      axes: ["z"]
      mode: axis_aligned
      transform_point_data:
        UMeanTrim: true
      transform_global_data:
        U_inf: true
    - _target_: ${dp:RandomTranslateMesh}
      distribution:
        _target_: torch.distributions.Uniform
        low:
          _target_: torch.tensor
          data: [-1.0, -1.0, 0.0]
        high:
          _target_: torch.tensor
          data: [1.0, 1.0, 0.0]
  transforms:
    - _target_: ${dp:DropMeshFields}
      global_data: [TimeValue]
    - _target_: ${dp:CaptureGeometry}
    - _target_: ${dp:SetGlobalField}
      fields:
        parameters: [1.205, 30.0]
    - _target_: ${dp:ComputeSDFFromBoundary}
      boundary_name: vehicle
      use_winding_number: false
      signed: false
      near_surface_normals: zero
      direction_threshold: 1.0e-6
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false
      boundary_name: vehicle
    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        UMeanTrim: velocity
        pMeanTrim: pressure
        nutMeanTrim: identity
      association: point_data
    - _target_: ${dp:RenameMeshFields}
      point_data:
        UMeanTrim: velocity
        pMeanTrim: pressure
        nutMeanTrim: nut
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      eps: 0.0
      fields:
        velocity:
          type: vector
          mean: [0.38983152820466843, -0.0008580543843955368, 0.008881391103026524]
          std: [0.3044505987801483, 0.15272179785130596, 0.11712216157497587]
        pressure:
          type: scalar
          mean: -0.2552665920339416
          std: 0.2413468710341852
        nut:
          type: scalar
          mean: 0.00048
          std: 0.00094001
targets:
  velocity: vector
  pressure: scalar
  nut: scalar
sampling_resolution: 200000
