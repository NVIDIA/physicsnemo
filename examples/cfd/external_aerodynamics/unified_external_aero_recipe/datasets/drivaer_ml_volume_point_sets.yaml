# DrivAerML prediction point sets and fields; model geometry/anchors are configured separately.
train_datadir: ${dataset_paths.drivaer_ml}
independent_validation: true
validation_reader_overrides:
  point_sets:
    interior: {indices_from: null}

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "run_*/domain_*.pdmsh"
    point_sets:
      interior:
        source: interior
        count: ${sampling_resolution}
        stream: 5
        indices_from: null
        fields:
          UMeanTrim: velocity
          pMeanTrim: pressure
          nutMeanTrim: nut
  # Keep the native frame so query draws cannot shift geometry/anchors.
  # No centering/augmentations: moments default to the file origin; augment=true is a no-op.
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: point_data
      fields:
        velocity: velocity
        pressure: pressure
        nut: identity
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        nut: {type: scalar, mean: 4.8e-4, std: 9.4e-4}

targets:
  velocity: vector
  pressure: scalar
  nut: scalar
