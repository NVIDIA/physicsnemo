# Single-branch ablation: only the selected field and anchor stream are loaded.
train_datadir: ${dataset_paths.drivaer_ml}
# Stored DrivAerML normals point inward; OpenFOAM shear acts on the fluid.
surface_normals_point: inward
wall_shear_acts_on: fluid
independent_validation: true
validation_reader_overrides:
  point_sets:
    interior: {indices_from: null}

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "run_*/domain_*.pdmsh"
    point_sets:
      geometry:
        source: vehicle
        count: 65536
        stream: 0
      supernodes:
        source: geometry
        count: 16384
        stream: 1
      surface_anchors:
        source: vehicle
        association: cell_centroids
        count: 16384
        stream: 2
      interior:
        source: vehicle
        association: cell_centroids
        count: ${sampling_resolution}
        stream: 4
        indices_from: null
        retain_cells_as: vehicle
        fields:
          pMeanTrim: pressure
          wallShearStressMeanTrim: wss
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: point_data
      fields:
        pressure: pressure
        wss: stress
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.00313}

targets:
  pressure: scalar
  wss: vector
