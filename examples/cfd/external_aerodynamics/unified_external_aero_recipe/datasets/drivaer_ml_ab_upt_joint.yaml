# Joint training uses both interacting surface and volume anchor streams.
train_datadir: ${dataset_paths.drivaer_ml}
# Stored DrivAerML normals point inward; OpenFOAM shear acts on the fluid.
surface_normals_point: inward
wall_shear_acts_on: fluid
independent_validation: true
validation_reader_overrides:
  point_sets:
    surface_queries: {indices_from: null}
    interior: {indices_from: null}

pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "run_*/domain_*.pdmsh"
    point_sets:
      geometry:
        source: vehicle
        count: 65536
        stream: 0
      supernodes:
        source: geometry
        count: 16384
        stream: 1
      surface_anchors:
        source: vehicle
        association: cell_centroids
        count: 16384
        stream: 2
      volume_anchors:
        source: interior
        count: 16384
        stream: 3
      surface_queries:
        source: vehicle
        association: cell_centroids
        count: ${sampling_resolution}
        stream: 4
        indices_from: null
        retain_cells_as: vehicle
        fields:
          pMeanTrim: pressure
          wallShearStressMeanTrim: wss
      interior:
        source: interior
        count: ${sampling_resolution}
        stream: 5
        indices_from: null
        fields:
          UMeanTrim: velocity
          pMeanTrim: pressure
          nutMeanTrim: nut
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: point_data
      fields:
        pressure: pressure
        wss: stress
        velocity: velocity
        nut: identity
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.00313}
        nut: {type: scalar, mean: 4.8e-4, std: 9.4e-4}

targets:
  surface.pressure: scalar
  surface.wss: vector
  volume.velocity: vector
  volume.pressure: scalar
  volume.nut: scalar

# Locations remain explicit because the two branches need not share a size.
target_sources:
  surface.pressure: boundaries.surface_queries.point_data.pressure
  surface.wss: boundaries.surface_queries.point_data.wss
  volume.velocity: interior.point_data.velocity
  volume.pressure: interior.point_data.pressure
  volume.nut: interior.point_data.nut
