# Joint training uses both interacting surface and volume anchor streams.
train_datadir: ${dataset_paths.drivaer_ml}
independent_validation: true

pipeline:
  reader:
    _target_: ab_upt.ABUPTDomainReader
    path: ${train_datadir}
    pattern: "run_*/domain_*.pdmsh"
    mode: joint
    surface_queries: ${sampling_resolution}
    volume_queries: ${sampling_resolution}
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: point_data
      fields:
        surface.pressure: pressure
        surface.wss: stress
        volume.velocity: velocity
        volume.pressure: pressure
        volume.nut: identity
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        surface.wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.00313}
        volume.nut: {type: scalar, mean: 4.8e-4, std: 9.4e-4}

targets:
  surface.pressure: scalar
  surface.wss: vector
  volume.velocity: vector
  volume.pressure: scalar
  volume.nut: scalar

# Locations remain explicit because the two branches need not share a size.
target_sources:
  surface.pressure: boundaries.abupt_surface.point_data.surface.pressure
  surface.wss: boundaries.abupt_surface.point_data.surface.wss
  volume.velocity: interior.point_data.volume.velocity
  volume.pressure: interior.point_data.volume.pressure
  volume.nut: interior.point_data.volume.nut
