defaults:
  - reader@reader: arrow
  - transforms@gradients: gradients
  - transforms@normals: normals
  - transforms@freestream: freestream
  - transforms@nondimensionalize: nondimensionalize
  - transforms@forces: forces
  - transforms@patch: patch
  - transforms@to_airfrans_sample: to_airfrans_sample
  - _self_

# Data paths (set via CLI overrides or environment)
dataset_path: /lustre/fsw/portfolios/coreai/projects/coreai_modulus_cae/datasets/airfrans/huggingface/  # used by reader=arrow
# dataset_path: /lustre/fsw/portfolios/coreai/projects/coreai_modulus_cae/datasets/airfrans/Dataset/  # used by reader=vtk

# Dataset parameters
task: full
split: train
device: auto

# Reader (populated from defaults)
reader: {}

# Dataset wrapping the reader + transforms
dataset:
  _target_: physicsnemo.datapipes.Dataset
  device: ${device}
  reader: ${reader}
  transforms:
    - ${gradients}
    - ${normals}
    - ${freestream}
    - ${nondimensionalize}
    - ${forces}
    - ${patch}
    - ${to_airfrans_sample}
