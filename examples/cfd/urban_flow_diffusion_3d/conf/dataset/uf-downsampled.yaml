# configs/dataset/uf-downsampled.yaml

type: "uf-downsampled"

data_dir: ${paths.dataset}  #data is already downsampled
ds_ratio: 4
img_res: [72, 22, 22]  # 3D resolution, original, but we pad it to 72,24,24 for unet
normalize: True

u_comp:
  min: -1.1370700673207321 
  max: 1.041396074425084   

v_comp:
  min: -1.0031025966526042 
  max: 1.2183490678412636 

w_comp:    
  min: -1.3040300483418614 
  max: 1.177769794747146 