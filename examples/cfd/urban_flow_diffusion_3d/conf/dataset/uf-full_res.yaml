# conf/dataset/uf-full_res.yaml

type: "uf-full-res"

data_dir: ${paths.dataset}
ds_ratio: 1
img_res: [288, 88, 88]  # 3D resolution, no spatial downsampling
normalize: True

##Values for both ds4 and ds1 are on slack channel
u_comp:
  min: -1.230890638507075
  max: 1.1078216005492938

v_comp:
  min: -1.0422102496009447
  max: 1.2183490678412636

w_comp:
  min: -1.3407524878963362
  max: 1.2768458311509887
