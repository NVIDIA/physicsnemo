#conf/model/model_configs.yaml
type: edm-precond-3d  # Name of the preconditioner

model_args:
  embedding_type: "positional" # or "fourier"
  encoder_type: "standard"
  decoder_type: "standard"
  model_channels: 64
  channel_mult: [1, 2, 2, 2]
  attention_levels: [3]
  num_blocks: 2
  dropout: 0
  channel_mult_emb: 4
  sigma_data: 0.5
