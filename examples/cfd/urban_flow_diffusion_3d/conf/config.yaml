#conf/config.yaml
base_dir: .

paths:
  root: ${base_dir}
  # Path to the training HDF5 file (U/V/W velocity fields at 288x88x88, see
  # README for expected layout -- either a combined `data` dataset or
  # separate `U`/`V`/`W` datasets, both are auto-detected). Override on the
  # CLI, e.g.:
  #   python train.py paths.dataset=/path/to/your/data.h5
  dataset: ./data/urban_flow_3d.h5
  outputs: ${paths.root}/outputs/${hydra:job.name}/${now:%Y-%m-%d_%H-%M}
  checkpoints: ${paths.outputs}/checkpoints
  generated: ${paths.outputs}/generated
  evaluation: ${paths.outputs}/evaluation

hydra:
  job:
    chdir: true
    name: urban_flow_diffusion_3d
  run:
    dir: ${paths.outputs}

defaults:
  - dataset: uf-full_res
  - model: model_configs
  - train: train_configs
  - generate: generate_configs
  - evaluate: evaluate_configs
  - visualize: visualize_configs
  - _self_
