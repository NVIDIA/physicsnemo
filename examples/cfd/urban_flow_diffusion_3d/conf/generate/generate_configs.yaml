#conf/generate/generate_configs.yaml
total_images: 4096
batch_size_per_gpu: 4 #only tested on multi-gpu A100s
seed: 1234

sampler:
  # "euler" | "heun" | "edm_stochastic_euler" | "edm_stochastic_heun"
  # (see physicsnemo.diffusion.samplers.SOLVERS)
  solver: euler
  num_steps: 100

io:
  inf_ckpt: 10
  mode: "unconditional" #'conditional'
  inf_ckpt_filepath: ${paths.checkpoints}/EDMPreconditioner.0.${..io.inf_ckpt}.mdlus
  gen_dir: ${paths.generated}/${..io.mode}
  filename: snaps-${..total_images}-solver-${..sampler.solver}.h5
  sample_shape: [3, 288, 88, 88]

perf:
  force_fp16: false
  use_torch_compile: false
  num_writer_workers: 1
