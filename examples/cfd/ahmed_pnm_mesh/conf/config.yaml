# Main config for Ahmed body GeoTransolver training with PNM mesh data.

defaults:
  - _self_
  - model: geotransolver
  - data: ahmed_body
  - training: default

output_dir: "runs"
checkpoint_dir: null
run_id: "ahmed_body_geotransolver"

precision: "float32"
compile: false
