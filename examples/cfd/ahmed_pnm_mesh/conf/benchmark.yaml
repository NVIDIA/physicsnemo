# Benchmark configuration for PNM mesh datapipe.
# Defines two separate pipelines (surface + volume) built from MeshReader.
#
# Usage:
#   python benchmark_datapipe.py --config-name benchmark data_dir=/path/to/data

defaults:
  - _self_

data_dir: ???
max_samples: 50

surface:
  reader:
    _target_: ${dp:MeshReader}
    path: ${data_dir}
    pattern: "**/boundary*.pt"
  transforms:
    - _target_: ${dp:CenterMesh}
    - _target_: ${dp:RandomRotateMesh}
      axes: ["y"]
    - _target_: ${dp:RandomScaleMesh}
    - _target_: ${dp:RandomTranslateMesh}
    - _target_: ${dp:SubsampleMesh}
      n_cells: 50000
    - _target_: ${dp:MeshToTensorDict}
  batch_size: 1

volume:
  reader:
    _target_: ${dp:MeshReader}
    path: ${data_dir}
    pattern: "**/volume*.pt"
  transforms:
    - _target_: ${dp:CenterMesh}
    - _target_: ${dp:RandomRotateMesh}
      axes: ["y"]
    - _target_: ${dp:RandomScaleMesh}
    - _target_: ${dp:RandomTranslateMesh}
    - _target_: ${dp:SubsampleMesh}
      n_points: 100000
    - _target_: ${dp:MeshToTensorDict}
  batch_size: 1
