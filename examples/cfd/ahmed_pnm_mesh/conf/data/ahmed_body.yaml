# Ahmed body dataset configuration.
# Adjust data_dir to point to your PNM mesh dataset root.

data_dir: ???

# Substring patterns to identify surface vs volume mesh files within each sample
surface_mesh_pattern: "boundary"
volume_mesh_pattern: "volume"

# Glob pattern for mesh files in each sample subdirectory
mesh_pattern: "*.pt"

# Path to precomputed stats.npz (from compute_stats.py). Set to null to skip normalization.
stats_path: null

# Explicit field names. Set to null to auto-discover from data.
surface_target_fields: null
volume_target_fields: null

# Train/validation split
train_split: 0.8
split_seed: 42

# physicsnemo DataLoader settings
batch_size: 1
prefetch_factor: 0
use_streams: false
