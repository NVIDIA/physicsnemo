#
# GeoTransolver model config for 2D Darcy (permeability -> pressure).
# Geometry: normalized 2D grid coordinates (x, y) per token.
# structured_shape: set to [H, W] to match the training grid so GALE uses Conv2d
# slice projection (same idea as Transolver). Omit for flattened mesh-style runs.

# Coming soon!

_target_: physicsnemo.experimental.models.geotransolver.GeoTransolver

functional_dim: 2
out_dim: 1
geometry_dim: 1   # 2D grid coords (x, y) as geometry
global_dim: null
# Must match root config target_size / grid (same as Transolver structured_shape)
structured_shape: ${target_size}

n_layers: 6
n_hidden: 128
dropout: 0.0
n_head: 8
act: gelu
mlp_ratio: 4
slice_num: 32
use_te: false
time_input: false
plus: false
include_local_features: false
