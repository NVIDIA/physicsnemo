data:
  data_file: "graybox_data.npz"

arch:
  layer_size: 64
  num_layers: 4

training:
  max_steps: 20000
  log_freq: 1000

scheduler:
  initial_lr: 1.e-3
  decay_rate: 0.95
  decay_steps: 1000

batch_size:
  data: 1000
  interior: 1000

# Physics-term weights. ``equilibria`` is weighted higher than ``pde`` because
# it is the term that actually pins down R in the unobserved region (u > u_obs)
# -- the PDE residual alone is satisfied by many different closures there.
loss_weights:
  pde: 1.0
  equilibria: 10.0
