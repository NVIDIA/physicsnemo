arch:
  decoder:
    out_features: 1
    layers: 1
    layer_size: 32

  fno:
    in_channels: 1
    dimension: 2
    latent_channels: 32
    fno_layers: 4
    fno_modes: 12
    padding: 9

scheduler:
  initial_lr: 1.E-3
  decay_rate: .85
  decay_pseudo_epochs: 8

training:
  resolution: 128
  batch_size: 32
  rec_results_freq: 8
  max_pseudo_epochs: 128
  pseudo_epoch_sample_size: 1024

validation:
  validation_pseudo_epochs: 4
  sample_size: 128

wave:
  speed: 1.0
  target_time: 0.5
  nr_modes: 5
  cfl: 0.25
