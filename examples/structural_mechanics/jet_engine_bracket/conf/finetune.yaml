# Recipe 3: adapt the DeepJEB-trained model to SimJEB with LoRA (finetune.py).
checkpoint: outputs/deepjeb/model.mdlus
data:
  root: ???                        # converted SimJEB
  split: splits/simjeb.json        # adapt on train, monitor on val, report val and test
  scales: stats/deepjeb_scales.json  # the pre-training scales: the adapted model keeps its output units
  coordinate_scale_mm: 100.0
  token_voxel_mm: 2.0
  num_workers: 4
  max_designs: null
lora:
  rank: 16
  alpha: null                      # null: alpha = rank (scaling 1)
training:
  epochs: 30
  lr: 1.0e-3                       # AdamW on the adapters
  warmup_epochs: 1
  final_lr_ratio: 0.1
  grad_clip: 1.0
  precision: bfloat16
  seed: 20261013
  val_every: 5
  log_every: 100
output_dir: outputs/simjeb_lora    # adapter.lora, state.pt (resume), train_log.jsonl, summary.json

hydra:
  run:
    dir: ${output_dir}/hydra
  output_subdir: null
  job:
    chdir: false
