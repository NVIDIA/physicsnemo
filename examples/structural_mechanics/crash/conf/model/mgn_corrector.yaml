# DeFormer corrector: residual_model.ResidualTimeConditional (frozen teacher
# recomputed on the fly) around mgn_corrector.MeshGraphNetCorrector (message
# passing on the shell mesh edges and on contact edges discovered on the
# teacher's predicted shape). The recipe adds model.teacher (the teacher's
# architecture) and model.teacher_weights (its checkpoint). dt, local_knn_k
# and local_neighborhood describe the teacher's datapipe (the datapipe config
# interpolates them).
_target_: residual_model.ResidualTimeConditional
_convert_: all
teacher_weights: ???
num_time_steps: ${training.num_time_steps}
dt: 0.005
local_knn_k: 32
local_neighborhood: euclidean
# node inputs: coords (3) + thickness (1) + fourier time code (time_dim) + teacher displacement (3)
functional_dim: 39
# teacher_window: true also feeds the teacher's displacement one frame earlier
# and one frame later (as backward and forward differences; functional_dim + 6)
teacher_window: false
time_embedding: fourier
time_fourier_bands: 8
time_dim: 32
hidden_dim: 128
processor_size: 8
num_processor_checkpoint_segments: 8
aggregation: sum
# contact edges from the crossing-aware node-to-facet search on the teacher's
# shape: 5 mm band, 10 mm reference clearance (assembled pairs are structure,
# not contact), features over a 10 mm scale, messages in both directions
use_contact: true
contact_search_implementation: warp
contact_surface_max_pairs: 8000000
contact_activation_distance: 5.0
node_contact_radius: 10.0
contact_normal_epsilon: 0.1
contact_surface_material_fan: true
contact_side_from_reference: true
contact_reference_clearance: 10.0
contact_side_symmetric: false
contact_crossing_radius: null
contact_clearance_approach_only: false
contact_bidirectional: true
# evaluation-time geometric corrections of the corrected shape: the rigid-wall
# clamp (needs datapipe.rigid_wall_position; on in the Yaris recipe) and the
# damped envelope projection (off: it removes true crossings as well)
final_clamp_to_wall: false
wall_axis: 0
wall_sign: 1.0
final_projection_iterations: 0
final_projection_damping: 0.5
final_projection_side_symmetric: true
final_projection_crossed_only: false
final_projection_tolerance_mm: 0.0
final_projection_band_mm: 5.0
final_projection_clearance_mm: 10.0
