# Time-conditional DeFormer (time_conditional.MeshGeoFLARETimeConditional): the
# GeoTransolver/FLARE backbone with a latent pre-processor, a post stage A whose
# zero-initialised side head gives a provisional position, and an independent
# post stage B whose gated correction gives the final position. The local
# stages are static kNN neighbourhood attention (k = 32) with the fused kernel.
# The values are the Yaris recipe's (yaris_deformer); the body-in-white recipe overrides
# the neighbourhood metric and the memory policy.
_target_: time_conditional.MeshGeoFLARETimeConditional
_convert_: all
# node inputs: coords (3) + thickness (1) + fourier time code (time_dim)
functional_dim: 36
out_dim: 3
geometry_dim: 3
global_dim: 32          # the time code as the global token (= time_dim)
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
num_time_steps: ${training.num_time_steps}
dt: 0.005               # frame interval in seconds (the datapipe reads it)
time_embedding: fourier
time_fourier_bands: 8
time_dim: 32
time_as_global: true
# local stages
input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 1   # stage A; stage B is an independent copy
mesh_pre_residual_gate_init: 0.0
mesh_post_residual_gate_init: 1.0
mesh_context_fusion: pre_post
mesh_context_use_global: false
local_neighborhood: euclidean  # the Yaris store edges cover shells only
local_knn_k: 32
local_num_heads: 8
local_mlp_ratio: 2
local_edge_dim: 32
local_activation: gelu
local_attention_fused: true
local_attention_backend: auto
# memory policy of the 1.48M-node forward: FLARE blocks and the geometry context
# are activation-checkpointed and each local processor is one segment
activation_checkpointing: true
checkpointing_ratio: 1.0
activation_checkpointing_components: [blocks, context]
num_pre_processor_checkpoint_segments: 1
num_post_processor_checkpoint_segments: 1
checkpoint_offloading: false
# evaluation-time rigid-wall clamp (off: the released network is evaluated as
# predicted; the corrector recipe applies the clamp)
clamp_to_wall: false
wall_axis: 0
wall_sign: 1.0
