# Time-conditional DeFormer: FLARE backbone with a latent pre-processor, a post
# stage A whose zero-initialized side head gives a provisional position, and an
# independent post stage B whose gated correction gives the final position.
# Local processors follow the kNN-attention recipe by default; set
# local_processor=mpnn (with the structural-edge datapipe) or knn_mpnn to swap.
_target_: time_conditional.MeshGeoFLARETimeConditional
_convert_: all
# node inputs: coords (3) + thickness (1) + fourier time code (time_dim)
functional_dim: 36
out_dim: 3
geometry_dim: 3
global_dim: 32          # the time code as a global token (= time_dim)
n_hidden: 256
n_head: 8
slice_num: 128
n_layers: 6
use_te: false
time_input: false
include_local_features: true
attention_type: GALE_FA
attn_scale: null
num_time_steps: ${training.num_time_steps}
time_embedding: fourier
time_fourier_bands: 8
time_dim: 32
time_as_global: true
# mesh / local processors
input_dim_edges: 4
mesh_hidden_dim: 256
num_pre_processor_layers: 1
num_post_processor_layers: 1   # stage A; stage B is an independent copy
num_pre_processor_checkpoint_segments: 0
num_post_processor_checkpoint_segments: 0
checkpoint_offloading: false
mesh_pre_residual_gate_init: 0.0
mesh_post_residual_gate_init: 1.0
mesh_context_fusion: pre_post
mesh_context_use_global: false
use_contact: false
# no BPTT: one forward per update, so no activation checkpointing on body-in-white-size meshes
activation_checkpointing: false
checkpointing_ratio: 1.0
activation_checkpointing_components: [blocks]
# local operator (second kNN-attention design)
local_processor: knn_attention
local_neighborhood: geodesic
local_knn_k: 32
local_num_heads: 8
local_mlp_ratio: 2
local_edge_dim: 32
local_activation: gelu
local_attention_fused: true
local_attention_backend: auto
local_value_norm: false
local_difference_values: true
local_update: concat_mlp
local_bias_fp32: true
local_split_key_value: true
# provisional-shape contact (off unless use_contact=true): node-to-facet surface
# contact, the analytic rigid wall, or both; clamp_to_wall projects the final
# prediction onto the admissible side of the wall
contact_source: surface
wall_axis: 0
wall_sign: 1.0
clamp_to_wall: false
# surface-contact v2 options: crossing-aware signed gaps from the reference side of
# each facet, and dropping pairs already assembled within contact_reference_clearance
# (mm) of each other in the reference configuration (null keeps every pair)
contact_side_from_reference: false
contact_reference_clearance: null
# weight-tied correction passes: >1 rebuilds the contact graph on the previous
# pass's final shape and reruns stage B (needs use_contact)
contact_iterations: 1
# global rigid-motion head (one translation + small rotation per graph from the
# pooled stage-A latent and the time code; zero-initialised)
global_motion: false
global_motion_scale_mm: 10.0
global_motion_lever_mm: 2000.0
# FLARE-block dropout; concrete_dropout replaces it with learned per-layer rates
# (initial rate max(dropout, 0.05)); pair with training.concrete_dropout_lambda
dropout: 0.0
concrete_dropout: false
# dropout on the kNN attention blocks' residual updates (standard, or learned
# ConcreteDropout sharing training.concrete_dropout_lambda)
local_dropout: 0.0
local_concrete_dropout: false
# part-pooled design tokens (datapipe.part_tokens): per-part encoder + attention
# pooling -> design_dim vector appended to the global token (global_dim must add
# design_dim) and to the global-motion head input
part_tokens: false
part_token_dim: 5
design_dim: 32
