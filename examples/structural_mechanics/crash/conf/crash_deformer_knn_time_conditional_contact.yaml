# Time-conditional DeFormer (kNN attention v2) with surface contact on the
# provisional shape: stage A predicts a contact-free coarse position, node-to-
# facet contact is discovered on that position (physical units, reference-
# geodesic exclusions as in the autoregressive contact recipe), the gated
# contact messages enter the stage-A latent, and stage B refines. Geometry-only
# contact features (no velocity, no predictive horizon: one query per time).
# Data, split, backbone, optimizer and the 100-epoch budget match
# crash_deformer_knn_time_conditional, its contact-free control.
defaults:
  - crash_deformer_knn_time_conditional
  - _self_

experiment_name: Crash-DeFormer-KNNAttention-TimeConditional-ProvisionalContact

reader:
  include_contact_topology: true

datapipe:
  contact_surface: true
  contact_require_elements: true
  contact_exclusion_hops: null
  contact_surface_exclusion: reference_geodesic
  contact_geodesic_distance_scale: 1.4142135623730951
  contact_geodesic_gap_scale: 1.0
  contact_geodesic_gap_min: 5.0
  contact_geodesic_max_pairs: 16000000
  contact_geodesic_cache_dir: ${datapipe.stats_dir}/surface_geodesic_cache

model:
  use_contact: true
  contact_dim: 8                      # geometry-only surface features
  contact_gate_init: 1.0e-3
  contact_aggregation: mean
  contact_search_implementation: warp
  contact_surface_max_pairs: 8000000  # fail on overflow; never truncate contacts
  contact_activation_distance: 5.0    # shell-clearance activation band, mm
  node_contact_radius: 10.0           # feature scaling only
  contact_normal_epsilon: 0.1         # direction regularization length, mm
  contact_surface_material_fan: true
  contact_include_velocity: false
  contact_surface_predictive: false
