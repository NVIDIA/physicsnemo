# Geodesic kNN-MPNN (MeshGraphNet messages on k=8 geodesic slots).
# Base: crash_deformer_knn_yaris_tc_loss_physical (TC kNN attention v2, Euclidean
# k=32, 60 epochs, MSE in millimetres over one common scale).
# Same connectivity as the geodesic attention recipe; the body-in-white winner's operator.
defaults:
  - crash_deformer_knn_yaris_tc_loss_physical
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-Geodesic-KNNMPNN

reader:
  include_solid_edges: true
  connect_isolated_k: 8

model:
  local_neighborhood: geodesic
  local_processor: knn_mpnn
  local_knn_k: 8
