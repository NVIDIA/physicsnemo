defaults:
  - crash_deformer_contact_autoregressive
  - _self_

experiment_name: Crash-DeFormer-GeodesicContact-Penetration-Autoregressive

# Loss-only ablation: original architecture, LR schedule, splits and 500 epochs.
# All lengths below are physical millimetres, NOT normalized coordinates.
# This 0.25 mm tolerance is unrelated to either of the existing 5 mm bands.
datapipe:
  penetration_loss_metadata: true

training:
  penetration_loss:
    tolerance_mm: 0.25
    length_scale_mm: 1.0
    # Three training trajectories: weighted output-gradient norm is 0.11--0.41
    # of MSE at this weight (frozen epoch-500 model; not parameter-gradient norms).
    max_weight: 0.00001
    warmup_epochs: 50
    ramp_epochs: 50
    implementation: warp
    pair_chunk_size: 65536
