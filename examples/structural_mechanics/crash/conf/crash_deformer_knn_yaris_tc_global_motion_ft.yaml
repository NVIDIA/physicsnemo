# Fine-tune the converged physical-loss model (epoch 60, 7.58 mm) with the global
# rigid-motion head switched on: pass training.warm_start_model=<final .mdlus>.
# Same 10-epoch schedule as crash_deformer_knn_yaris_tc_loss_physical_ft (7.56 mm).
defaults:
  - crash_deformer_knn_yaris_tc_global_motion
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-GlobalMotion-FineTune

training:
  epochs: 10
  start_lr: 2.0e-5
  end_lr: 1.0e-6
  validation_freq: 2
  save_checkpoint_freq: 2
  warm_start_model: null
