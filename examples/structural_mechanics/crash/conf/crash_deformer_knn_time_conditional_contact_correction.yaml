# Contact correction of the time-conditional prediction: as
# crash_deformer_knn_time_conditional_contact (surface contact discovered on the
# provisional shape, gated messages into the correction stage), with a deeper
# correction stage (two kNN layers instead of the one-layer copy of stage A)
# that also receives the provisional displacement through a zero-initialised
# adapter. Function-preserving at initialisation; same data, budget and
# optimizer as the control.
defaults:
  - crash_deformer_knn_time_conditional_contact
  - _self_

experiment_name: Crash-DeFormer-KNNAttention-TimeConditional-ContactCorrection

model:
  num_refinement_layers: 2
  refinement_input_displacement: true
