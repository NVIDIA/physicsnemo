# Minimal variant of the first kNN-attention block: values projected from the
# raw residual stream (separate key/value matrices), float32 geometric bias and
# AdamW for narrow matrices; the residual add-then-FFN update and plain values
# are kept. Together with crash_deformer_knn_v2_autoregressive this isolates the
# contribution of difference values plus the concatenate-then-MLP update.
defaults:
  - crash_deformer_knn_autoregressive
  - _self_

experiment_name: Crash-DeFormer-KNNAttentionRawValues-Autoregressive

training:
  muon_min_dim: 9

model:
  local_attention_fused: true
  local_value_norm: false
  local_split_key_value: true
  local_bias_fp32: true
