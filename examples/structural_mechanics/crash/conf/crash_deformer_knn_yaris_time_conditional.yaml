# Time-conditional DeFormer on the full-resolution Yaris mesh: every future frame
# (stride 5, 5 ms) is predicted independently from the initial mesh with the
# second kNN-attention design (Euclidean k=32) before and after FLARE, a Fourier
# time code in the node inputs and as a global token, and the provisional-
# position loss. Data, split, outlier mask, statistics and neighborhoods are
# shared with crash_deformer_knn_yaris_autoregressive. A full-mesh forward does
# not fit a GB300 without activation checkpointing, so FLARE blocks and the
# context are checkpointed (ratio 1.0) and each local processor is one segment.
defaults:
  - crash_deformer_knn_yaris_autoregressive
  - override model: deformer_time_conditional
  - _self_

experiment_name: Yaris-DeFormer-KNNAttention-FullMesh-TimeConditional

training:
  epochs: 60           # body-in-white time-conditional runs peaked near epoch 20; Yaris has 69 cases
  start_lr: 2.0e-4
  end_lr: 1.0e-6
  validation_freq: 5
  save_checkpoint_freq: 5
  coarse_loss_weight: 0.1
  muon_min_dim: 9

datapipe:
  sample_type: one_time_step
  initial_history_steps: 1

model:
  dt: 0.005
  local_neighborhood: euclidean
  num_pre_processor_checkpoint_segments: 1
  num_post_processor_checkpoint_segments: 1
  activation_checkpointing: true
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks, context]
