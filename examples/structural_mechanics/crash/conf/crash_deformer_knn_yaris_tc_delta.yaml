# Delta-to-reference: the time-conditional model predicts a held-out design's
# response as a training design's known response plus the learned difference.
# Training pairs each sample with a training reference at the same future frame
# (nearest-5 by thickness distance half of the time, any design otherwise); the
# node features carry both thickness fields; validation averages the predictions
# from the 3 nearest training designs. Needs the neighbour ranking prepared once:
# yaris_full_prepare.py --config-name crash_deformer_knn_yaris_tc_delta.
defaults:
  - crash_deformer_knn_yaris_tc_loss_physical
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-DeltaReference

datapipe:
  delta_reference: true
  delta_val_references: 3
  delta_train_nearest_prob: 0.5
  delta_train_nearest_k: 5

model:
  functional_dim: 37   # 3 coords + own thickness + reference thickness + 32 time code
