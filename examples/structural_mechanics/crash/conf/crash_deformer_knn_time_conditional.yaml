# Time-conditional DeFormer with static kNN neighborhood attention (second
# design) before and after FLARE. Same data split, backbone, time code and
# training budget as crash_geoflare_time_conditional; adds the provisional
# position loss (weight 0.1) and the structural-graph datapipe with kNN
# neighborhoods.
defaults:
  - crash_geoflare_time_conditional
  - override datapipe: graph
  - override model: deformer_time_conditional
  - _self_

experiment_name: Crash-DeFormer-KNNAttention-TimeConditional

training:
  coarse_loss_weight: 0.1

datapipe:
  sample_type: one_time_step
  initial_history_steps: 1
  local_knn_k: ${model.local_knn_k}
  local_knn_metric: ${model.local_neighborhood}
  local_knn_cache_dir: ${datapipe.stats_dir}/local_knn_cache
