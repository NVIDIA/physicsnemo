# L1 loss in millimetres (median-seeking bracket).
# Base: crash_deformer_knn_yaris_time_conditional (TC kNN attention v2, Euclidean
# k=32, 60 epochs, validation RMSE 9.06 mm with the per-axis standardized MSE).
# Identical to the physical-scale control except for the loss kind.
defaults:
  - crash_deformer_knn_yaris_time_conditional
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-Loss-L1

training:
  loss: l1
  loss_space: physical
  loss_scale_mm: 10.0
