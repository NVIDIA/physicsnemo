# Physical-loss time-conditional control with an exponential moving average of
# the weights (decay 0.999 per update, ~9 epochs at 112 updates per epoch);
# validation and the saved ema/ weights use the average.
defaults:
  - crash_deformer_knn_yaris_tc_loss_physical
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-EMA

training:
  ema_decay: 0.999
