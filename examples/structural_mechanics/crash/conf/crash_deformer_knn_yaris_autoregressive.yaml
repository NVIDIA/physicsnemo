# Full-resolution Yaris (1.48M nodes, outliers removed) with the kNN-attention
# DeFormer, no contact. Same model, optimizer, schedule and BPTT-4 windows as
# the body-in-white kNN recipe; the data path, dt (5 ms at stride 5) and the memory policy
# change. FLARE blocks and the geometry context are checkpointed inside each
# checkpointed rollout step so one block's activations are live at a time.
defaults:
  - crash_deformer_knn_autoregressive
  - override reader: yaris_full
  - override datapipe: yaris_full
  - _self_

experiment_name: Yaris-DeFormer-KNNAttention-FullMesh-Autoregressive

yaris:
  data_root: ???       # directory of <case>.zarr stores
  split_manifest: ???  # dataset creator's splits.csv
  outlier_mask: ???    # outlier_nodes.npz with a boolean `exclude` array (null keeps all)
  work_dir: ???        # fresh task-owned directory for stats, caches, checkpoints
  stride: 5

hydra:
  run:
    dir: ${yaris.work_dir}

training:
  trainer_class: yaris_full_trainer.YarisFullTrainer  # exact, horizon-aware validation
  raw_data_dir: ${yaris.data_root}
  raw_data_dir_validation: ${yaris.data_root}
  num_training_samples: 69
  num_validation_samples: 20
  num_time_steps: 31  # ceil(152 / 5); per-case horizons come from the stores
  num_dataloader_workers: 0
  ckpt_path: ${yaris.work_dir}/checkpoints
  tensorboard_log_dir: ${yaris.work_dir}/tensorboard
  validation_freq: 20
  save_checkpoint_freq: 5
  deterministic: false
  reproducible_sampling: true
  sampler_seed: 0
  acceleration_loss_weight: 0.0

model:
  dt: 0.005
  local_neighborhood: euclidean  # store edges cover shells only; solids would be isolated
  local_attention_fused: true
  activation_checkpointing: true
  # Measured on one GB300 (1.48M nodes, k=32, fused): ratio 1.0 -> 14.5 s/update, 114 GB;
  # 0.5 -> 13.8 s, 174 GB; 0.33 -> 13.6 s, 194 GB; 0 -> 13.2 s, 234 GB; none -> OOM (284 GB).
  checkpointing_ratio: 0.5
  activation_checkpointing_components: [blocks, context]

inference:
  raw_data_dir_test: ${yaris.data_root}
  split: test
  output_dir_pred: ${yaris.work_dir}/inference
