# Equal frame weighting on top of the physical-scale control.
# Base: crash_deformer_knn_yaris_time_conditional (TC kNN attention v2, Euclidean
# k=32, 60 epochs, validation RMSE 9.06 mm with the per-axis standardized MSE).
# Each frame's loss is divided by an EMA of its own loss (momentum 0.99), so the
# crush phase is not drowned by the slow tail.
defaults:
  - crash_deformer_knn_yaris_time_conditional
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-Loss-FrameWeight

training:
  loss: mse
  loss_space: physical
  loss_scale_mm: 10.0
  frame_weighting: ema
  frame_weighting_ema: 0.99
