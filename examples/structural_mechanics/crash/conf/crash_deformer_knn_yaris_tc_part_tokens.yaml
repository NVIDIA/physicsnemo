# Physical-loss time-conditional control with part-pooled design tokens (one token
# per part: centroid, log size, mean standardized thickness) encoded into a 32-d
# design vector that joins the global token and drives the global rigid-motion
# head. Targets the case-specific vehicle-kinematics error, which is 74% linear
# in the design on the control. General for any FE model with part ids.
defaults:
  - crash_deformer_knn_yaris_tc_loss_physical
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-PartTokens

datapipe:
  part_tokens: true

model:
  part_tokens: true
  part_token_dim: 5      # centroid (3) + log size + mean thickness
  design_dim: 32
  global_dim: 64         # 32 time code + 32 design vector
  global_motion: true
