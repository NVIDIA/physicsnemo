# Huber loss in millimetres (robust to the heavy error tail).
# Base: crash_deformer_knn_yaris_time_conditional (TC kNN attention v2, Euclidean
# k=32, 60 epochs, validation RMSE 9.06 mm with the per-axis standardized MSE).
# Quadratic below 3 mm, linear above; otherwise identical to the physical-scale control.
defaults:
  - crash_deformer_knn_yaris_time_conditional
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-Loss-Huber

training:
  loss: huber
  loss_space: physical
  loss_scale_mm: 10.0
  huber_delta_mm: 3.0
