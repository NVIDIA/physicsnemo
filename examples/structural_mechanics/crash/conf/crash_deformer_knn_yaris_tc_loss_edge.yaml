# Local-geometry term on top of the physical-scale control.
# Base: crash_deformer_knn_yaris_time_conditional (TC kNN attention v2, Euclidean
# k=32, 60 epochs, validation RMSE 9.06 mm with the per-axis standardized MSE).
# Adds the squared error of neighbour-relative positions over the static k=32
# Euclidean slots (same mm scale), weight 1.0: penalises wrong folds, not offsets.
defaults:
  - crash_deformer_knn_yaris_time_conditional
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-Loss-Edge

training:
  loss: mse
  loss_space: physical
  loss_scale_mm: 10.0
  edge_loss_weight: 1.0
