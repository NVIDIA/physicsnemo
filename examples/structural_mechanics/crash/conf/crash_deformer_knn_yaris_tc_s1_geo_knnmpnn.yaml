# Stride-1 geodesic kNN-MPNN (k=8).
# Every 1 ms frame of each run is a training pair (about 9,100 pairs per epoch over
# the 69 training runs, 5x the stride-5 recipe), validation scores every frame of
# the 20 held-out runs, and the budget is 15 epochs so the number of updates is
# about 25% above the 60-epoch stride-5 recipes. Needs a stride-1 work dir
# (frozen statistics are stride-specific; kNN caches can be copied).
defaults:
  - crash_deformer_knn_yaris_tc_geo_knnmpnn
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-S1-Geodesic-KNNMPNN

yaris:
  stride: 1

training:
  num_time_steps: 152   # longest run: 152 frames (94 to 152 across the 99 runs)
  epochs: 15
  validation_freq: 3
  save_checkpoint_freq: 3

model:
  dt: 0.001
