# Physical-loss time-conditional control plus a mesh-derived design signal: each
# node carries its thickness deviation from the training-fleet mean at that node
# (scaled by the fleet deviation std) as a second feature column. Motivated by the
# per-case analysis of the control: its late-time rigid-body error per validation
# case (-12 .. +8 mm) is 96% case-specific and correlates with the thickness
# deviations (R^2 0.74 on 19 cases), i.e. the network under-reacts to the tiny
# standardized thickness changes between designs. General for shared-mesh data;
# no design metadata is used (contrast crash_deformer_knn_yaris_tc_euclid_attn_doe).
defaults:
  - crash_deformer_knn_yaris_tc_loss_physical
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-ThicknessDeviation

datapipe:
  thickness_deviation: true

model:
  functional_dim: 37   # 3 coords + thickness + thickness deviation + 32 time code
