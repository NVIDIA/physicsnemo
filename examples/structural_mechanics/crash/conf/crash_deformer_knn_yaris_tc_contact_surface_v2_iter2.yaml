# Surface contact v2 with two weight-tied correction passes: contact is discovered
# on the provisional shape, stage B corrects, then contact is rediscovered on that
# corrected shape and the same stage B runs again from the same stage-A latent.
defaults:
  - crash_deformer_knn_yaris_tc_contact_surface_v2
  - _self_

experiment_name: Crash-DeFormer-Yaris-TC-Contact-Surface-v2-Iter2

model:
  contact_iterations: 2
