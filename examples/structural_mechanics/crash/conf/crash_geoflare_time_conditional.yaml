# Time-conditional GeoTransolver/FLARE baseline on the body-in-white crash split with the
# same time code and training budget as the time-conditional DeFormer: each
# future frame is predicted independently from the initial mesh. The budget
# is short with frequent validation.
hydra:
  job:
    chdir: true
  run:
    dir: ./outputs/

experiment_name: Crash-GeoFLARE-TimeConditional

defaults:
  - reader: vtp
  - datapipe: point_cloud
  - model: geotransolver_time_conditional
  - training: default
  - inference: default
  - _self_

training:
  raw_data_dir: ???
  raw_data_dir_validation: ???
  global_features_filepath: null
  optimizer: muon
  amp: true
  amp_dtype: bfloat16
  manual_gradient_allreduce: true
  seed: 42
  num_time_steps: 26
  num_training_samples: 127
  num_validation_samples: 8
  epochs: 100
  start_lr: 2.0e-4
  end_lr: 1.0e-6
  validation_freq: 5
  save_checkpoint_freq: 5
  early_stopping_patience: 0
  acceleration_loss_weight: 0.0
  coarse_loss_weight: 0.0
  reproducible_sampling: true
  sampler_seed: 0
  muon_min_dim: 9

inference:
  raw_data_dir_test: ???

datapipe:
  static_features: [thickness]
  dynamic_targets: []
  global_features: null
  sample_type: one_time_step
  initial_history_steps: 1

model:
  # coords (3) + thickness (1) + fourier time code (32)
  functional_dim: 36
  out_dim: 3
  global_dim: 32
  n_hidden: 256
  n_head: 8
  attention_type: GALE_FA
  attn_scale: null
  time_embedding: fourier
  time_fourier_bands: 8
  time_dim: 32
  time_as_global: true
