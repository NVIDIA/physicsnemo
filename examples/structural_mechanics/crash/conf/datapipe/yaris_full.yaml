_target_: yaris_full.YarisFullGraphDataset
_convert_: all
data_dir: ${yaris.data_root}
num_samples: ${training.num_training_samples}
num_steps: ${training.num_time_steps}
dt: ${model.dt}
stats_dir: ${yaris.work_dir}/stats
sample_type: random_time_window
initial_history_steps: 2
rollout_window_steps: 4
windows_per_sample: 1
window_seed: 42
static_features: [thickness]
dynamic_features: []
dynamic_targets: []
global_features: null
local_knn_k: ${model.local_knn_k}
local_knn_metric: ${model.local_neighborhood}
local_knn_cache_dir: ${yaris.work_dir}/local_knn_cache
design_variables: false     # 8 thickness-group deviations (+ known flag) as a global token
contact_surface: false      # shell facets, physical thickness and one-ring exclusions on the graph
rigid_wall_position: null   # analytic rigid wall plane (Yaris: x = 100 mm)
# second feature column: node thickness minus its mean over the training cases,
# over the fleet deviation scale (mesh-derived design signal; model.functional_dim +1)
thickness_deviation: false
# design mixup on training samples: blend two cases at the same future frame with
# lambda ~ Beta(alpha, alpha) (features, design token, target); 0 disables
mixup_alpha: 0.0
mixup_prob: 0.5
# output baseline: training-mean normalized displacement per future frame (prepared
# by yaris_full_prepare.py); the model adds it to its prediction
mean_displacement_baseline: false
# delta-to-reference: pair every sample with a training design at the same frame
# (features of both, the reference's displacement as output baseline); validation
# averages over the nearest delta_val_references training designs
delta_reference: false
delta_val_references: 3
delta_train_nearest_prob: 0.5
delta_train_nearest_k: 5
# per-part design tokens: reference centroid, log size and per-part means of the
# node feature columns, under global_features['parts'] (needs nodes/part_id)
part_tokens: false
