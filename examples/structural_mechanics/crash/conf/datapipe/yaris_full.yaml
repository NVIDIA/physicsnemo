_target_: yaris_full.YarisFullGraphDataset
_convert_: all
data_dir: ${yaris.data_root}
num_samples: ${training.num_training_samples}
num_steps: ${training.num_time_steps}
dt: ${model.dt}
stats_dir: ${yaris.work_dir}/stats
# one (case, future frame) pair per sample, predicted from the initial frame
sample_type: one_time_step
initial_history_steps: 1
static_features: [thickness]
dynamic_features: []
dynamic_targets: []
global_features: null
# static reference kNN neighbourhoods of the local attention (built once, cached)
local_knn_k: ${model.local_knn_k}
local_knn_metric: ${model.local_neighborhood}
local_knn_cache_dir: ${datapipe.stats_dir}/local_knn_cache
# shell facets, nodal thickness and one-ring exclusions on the graph, for the
# contact search of the corrector and the penetration metrics
contact_surface: false
# structural shell connectivity in both directions with its standardized
# reference features (graph.mesh_edge_index / mesh_edge_attr / mesh_edge_mean /
# mesh_edge_std), for the MeshGraphNet corrector; edge_index itself is unchanged
mesh_edges: false
# frame pairs (one_time_step training samples): the target holds two consecutive
# future frames [N, 2, 3] (k and k+1; the last frame pairs backwards) under the
# earlier frame's time label, for training.increment_loss_weight
frame_pairs: false
# analytic rigid wall plane x = position in mm (Yaris barrier: 100), for the
# wall clamp and the wall penetration metrics
rigid_wall_position: null
