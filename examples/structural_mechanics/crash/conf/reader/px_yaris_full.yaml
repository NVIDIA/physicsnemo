_target_: readers.px_yaris_reader.YarisFullReader
_convert_: all
manifest_path: ${yaris.split_manifest}
outlier_mask_path: ${yaris.outlier_mask}
stride: ${yaris.stride}
raw_dt: 0.001  # seconds; the stores hold 1 ms frames
max_frames: null
include_solid_edges: false  # add hexahedral solid-element edges for geodesic neighborhoods
connect_isolated_k: 0       # Euclidean links for edge-less nodes (0 = off)
