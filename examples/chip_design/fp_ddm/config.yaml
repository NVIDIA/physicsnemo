seed: 10

# Local PhysicsNeMo FNO and dimensional scales used by its wrapper.
model:
  in_channels: 5
  out_channels: 1
  modes: 16
  width: 32
  layers: 4
  decoder_layers: 1
  decoder_width: 32
  padding: 0
  normalization:
    length: 1.0
    conductivity: 200.0
    temperature_reference: 350.0
    temperature_scale: 100.0
    heat_source: 1.0

# Synthetic, label-free local problems generated during training.
dataset:
  grid_size: 32
  k_min: 3.0
  k_max: 200.0
  T_min: 300.0
  T_max: 400.0
  q_min: 0.0
  q_max: 0.0
  sigma: 10.0
  k_generation_method: pixelwise_smooth
  boundary_generation_method: pixelwise_smooth

# Physics-informed training and PhysicsNeMo checkpoint settings.
training:
  epochs: 10
  samples: 500000
  batch_size: 256
  num_workers: 10
  learning_rate: 0.001
  pde_weight: 1.0
  boundary_weight: 1.0
  max_minutes: 25.0
  output_dir: outputs/train
  resume_dir: null

# Overlapping global decomposition. The layout generator currently requires a
# square patch grid with square patches.
domain:
  rows: 20
  columns: 20
  width: 32
  height: 32
  overlap: 3
  coarse_initialization: false
  outer_boundary:
    top: {type: dirichlet, value: 330.0}
    bottom: {type: dirichlet, value: 390.0}
    left: {type: dirichlet, value: 350.0}
    right: {type: dirichlet, value: 310.0}

# Matrix-free finite-volume reference solver.
fem:
  batch_size: 10
  max_iter: 1000
  tolerance: 1.0e-12

# Schwarz workflow. Handler choices are: parallel, gradient, and exchange.
run:
  seed: 1
  solver: fem
  checkpoint_dir: null
  output_dir: outputs/schwarz
  batch_size: 1000
  handler: parallel
  handler_learning_rate: 10.0
  exchange_alpha: 1.0
  max_iterations: 50
  tolerance: 1.0e-9
  patience: 10000
  ttt_steps: 0
  ttt_batch_size: 1000
  ttt_learning_rate: 5.0e-5
  ttt_pde_weight: 1.0
  ttt_boundary_weight: 1.0
  visualize: true
  ground_truth: true

# Optional PNG and MP4 output ranges.
visualization:
  fps: 10
  temperature_min: 300.0
  temperature_max: 400.0
  conductivity_min: 10.0
  conductivity_max: 200.0

hydra:
  run:
    dir: .
  output_subdir: null
