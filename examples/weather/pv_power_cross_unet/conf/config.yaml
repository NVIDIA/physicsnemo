hydra:
  job:
    chdir: True
  run:
    dir: ./outputs/

# Data
seed: 0
num_train_samples: 256
num_valid_samples: 32
seq_len: 96         # 24 h at 15-min cadence
pred_len: 16        # 4 h forecast horizon
target_channels: 4  # 3 history channels + 1 current power channel
weather_channels: 3 # irradiance, temperature proxy, humidity proxy

# Model
seg_len: 12
e_layers: 3
d_model: 64
n_heads: 4
d_ff: 128
dropout: 0.0
nonlinear_correlation_proj: True
attention_kind: two_stage
merge_kind: seg_merge
use_bottleneck_in_decoder: True

# Optimization
batch_size: 8
batch_size_valid: 8
max_epochs: 2
start_lr: 1.0e-3
lr_scheduler_gamma: 0.99
checkpoint_save_freq: 1
