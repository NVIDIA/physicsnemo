hydra:
  job:
    chdir: False
  run:
    dir: .

# train, predict, or evaluate
mode: train

# Data
data_file: ./dataset/your_data.csv
time_col: Time
target_col: power
weather_cols:
  - SWR
freq_minutes: 15
seq_len: 96
pred_len: 16
horizon_label: null  # null, 4h, 1d, or 7d; labels override seq_len/pred_len/seg_len
normalization: standard  # standard or minmax
max_train_samples: null
max_valid_samples: null
max_predict_samples: null

# Model
seg_len: 12
e_layers: 3
d_model: 256
n_heads: 4
d_ff: 512
dropout: 0.0
nonlinear_correlation_proj: True
attention_kind: two_stage
merge_kind: seg_merge
use_bottleneck_in_decoder: True

# Optimization
seed: 2021
batch_size: 16
batch_size_valid: 16
max_epochs: 100
early_stop_patience: 5
start_lr: 1.0e-4
lr_scheduler_gamma: 0.99

# Outputs
output_dir: ./outputs/real_cross_unet
checkpoint_path: null
prediction_path: null
metrics_csv_path: ./outputs/real_cross_unet/metrics.csv
