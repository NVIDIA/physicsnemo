outdir: rundir
experiment_name: fgn
run_id: "0"
rundir: ${training.outdir}/${training.experiment_name}/${training.run_id}
checkpoint_dir: checkpoints
num_data_workers: 0
seed: 7
batch_size: 8
total_train_steps: 100
print_progress_freq: 10
checkpoint_freq: 50
validation_freq: 25
resume_checkpoint: latest
# Gradient norm clipping. All comparable models (StormCast: 1.0, GraphCast: 32.0)
# enable this. -1.0 disables; 1.0 is a safe default for AR rollout training.
clip_grad_norm: 1.0

# Autoregressive rollout depth per training step.
# Must match dataset.future_frames. 1 = single-step training (paper Stages
# 1-3). Stage 4 ramps ar_steps up to 8 per Table A.2.
ar_steps: 1

# Data + domain parallelism knobs (mirrors StormCast's convention):
# - domain_parallel_size=1 & force_sharding=false → pure single-process or
#   plain DDP; smoke-test default.
# - domain_parallel_size>1 → ShardTensor on a spatial axis of the input.
# - force_sharding=true → wrap with ShardTensor even at domain size 1,
#   to exercise the sharding code path end-to-end.
domain_parallel_size: 1
force_sharding: false
# bf16 autocast (mirrors graphcast amp convention). Default true for H100;
# set false for fp32 debugging or CPU-only smoke tests.
amp: true
# torch.compile the model forward for ~10-30% throughput gain (CorrDiff/GraphCast
# pattern). Skipped automatically when ShardTensor is active. First run adds ~60s
# warm-up. Disable for quick smoke tests or CPU-only runs.
torch_compile: false

# Experiment tracking via physicsnemo.utils.logging.LaunchLogger.
# use_wandb=true routes loss/lr/val metrics to W&B (needs WANDB_API_KEY).
# use_mlflow=true routes to MLflow. Both default off.
use_wandb: false
wandb_project: fgn
use_mlflow: false

# Number of validation batches per rank when running under ParallelHelper —
# the rank-sharded sampler is infinite by design (StormCast convention),
# so we cap iteration here. Null = use one local epoch (len(valid_dataset)
# / (world_size * batch_size)).
validation_steps: null

# Figure 2 + 3 validation diagnostics (per-variable CRPS / RMSE /
# spread-skill / rank hist / 1D power spectra). Off by default so the
# smoke test stays cheap.
validation_metrics: false
validation_ensemble_size: 4

optimizer:
  # Paper Table A.2: lr=8e-5 (stages 2-4), weight_decay=0.1, warmup=1000 steps.
  lr: 8.0e-5
  betas: [0.9, 0.999]
  weight_decay: 0.1
  lr_warmup_steps: 1000
  lr_min: 0.0

loss:
  num_samples: 4
  mse_weight: 0.1
