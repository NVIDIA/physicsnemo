# Configuration for replicating the training of the CorrDiff regression+diffusion
# downscaling model on the Taiwan dataset (https://arxiv.org/abs/2309.15214).
# For new downscaling projects, reference_downscaling.yaml (diffusion-only DiT) or
# reference_corrdiff.yaml (regression+diffusion U-Net) is recommended.


# Defaults
defaults:

  # Dataset
  - dataset/xarray  # replace with your own if using a custom dataset

  # Model
  - model/replication_corrdiff

  # Training
  - training/default

  # Sampler
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

model:
  # Pretrained regression model, where regression training saves its final checkpoint
  # when run with training.experiment_name=regression
  regression_weights: "rundir/regression/0/checkpoints_regression/StormCastUNet.0.450000.mdlus"

dataset: # remove if using custom dataset
  state_access_patterns: # the "state" (training target)
    wrf:
      channels: ["mrr", "t2m", "u10m", "v10m"]
      time_steps: [0]
  background_access_patterns: # the "background" (conditioning)
    era5:
      channels: ["tcwv", "z500", "t500", "u500", "v500", "z850", "t850", "u850", "v850", "t2m", "u10m", "v10m"]
      time_steps: [0]

training:
  loss:
    type: 'edm' # use "regression"/"edm" here to train your regression/diffusion model
  total_train_steps: 450000 # set according to your needs
  checkpoint_freq: 10000 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 10000 # how often to record the validation loss, measured in number of training steps
  validation_plot_variables: [mrr, t2m, u10m, v10m] # state channels to plot during validation
  perf:
    fp_optimizations: fp32
    torch_compile: true
