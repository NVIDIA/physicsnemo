# Options for inference.py, added to a training config with +inference=default

inference:
  diffusion_checkpoint: ??? # diffusion model .mdlus checkpoint
  regression_checkpoint: null # regression model .mdlus checkpoint; null to use model.regression_weights
  indices: [0] # indices of the validation dataset samples to generate
  ensemble_size: 1 # number of samples generated for each index
  seed: 0 # random seed
  output_dir: ${training.rundir}/inference # directory for the output Zarr store and plots
  save_regression: false # also save the regression model prediction (regression+diffusion models only)
  plot_variables: [] # state channels to plot for each index; empty for no plots

hydra:
  output_subdir: null # don't overwrite the Hydra config saved in the training run directory
