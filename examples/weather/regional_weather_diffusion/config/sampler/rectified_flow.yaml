# Defaults

# Sampler args for physicsnemo.diffusion.samplers.sample with a rectified-flow
# model (training.loss.type: flow_matching): integrates the rectified-flow ODE
# dx/dt = (x_t - x0_hat) / t from pure noise (t = 1) to t = 0.

name: 'Rectified flow'
args:
  num_steps: 18 # Number of solver steps
  solver: heun # "heun" (2nd order, 2 model evaluations per step) or "euler" (1st order)
  time_shift: 1.0 # Time shift a, t -> a t / (1 + (a - 1) t); use a > 1 to sample a larger domain than the training patches
  S_churn: 0. # Set > 0 for stochastic sampling (EDM-style churn, see the EDM paper); the churn of the solvers assumes alpha = 1 and is an approximation for rectified flow
  S_min: 0.
  S_max: .inf
  S_noise: 1
