# Configuration for replicating the training of the StormScope Meteosat EU model
# (https://huggingface.co/nvidia/stormscope-meteosat), available in Earth2Studio as
# StormScopeMeteosatEU. For new projects, reference_stormscope.yaml is recommended.


# Defaults
defaults:

  # Dataset
  - dataset/xarray  # replace with your own if using a custom dataset

  # Model
  - model/replication_stormscope_absposemb

  # Training
  - training/default

  # Sampler
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

model:
  hyperparameters:
    num_heads: 12

dataset: # remove if using custom dataset; data on the 1120 x 2432 MTG-FCI 2 km grid over Europe
  time_range_train: ["2024-11-01T00:00:00", "2026-06-01T00:00:00"]
  time_range_valid: ["2024-10-01T00:00:00", "2024-11-01T00:00:00"]
  state_access_patterns: # the "state" (training target)
    radiance:
      channels: [fci04vis, fci05vis, fci06vis, fci08vis, fci09vis, fci13nir, fci16nir, fci22nir, fci38ir, fci63wv, fci73wv, fci87ir, fci97ir, fci105ir, fci123ir, fci133ir] # MTG-FCI
      time_steps: [1]
  background_access_patterns: # the "background" (conditioning)
    solar_angles: {channels: [cos_zenith, sin_azimuth, cos_azimuth], time_steps: [-5, -4, -3, -2, -1, 0, 1]} # computed from lat_lon_variables
    radiance: {channels: "${dataset.state_access_patterns.radiance.channels}", time_steps: [-5, -4, -3, -2, -1, 0]}
  invariants_path: data/invariants.zarr # replace with your invariants file
  invariant_variables: # names as in the metadata of the model package
    - elev_mean # mean surface elevation in pixel
    - elev_std # standard deviation of surface elevation in pixel
    - lsm_mean # land fraction in pixel
    - mtg_fci_time_offset # approximate difference of the FCI scan time from the reference time
    - view_angle_y # satellite viewing angles
    - view_angle_x
    - equidist_y # along-surface displacement from the sub-satellite point
    - equidist_x
    - cos_sat_zenith_angle # cosine of the satellite zenith angle
  lat_lon_variables: [lat, lon] # replace with the latitude and longitude names in your invariants file
  mask_variable: earth_mask # pixels on the Earth disk
  time_step_seconds: 600 # 10 min

training:
  batch_size: 16

  loss:
    type: 'edm'
    sigma_distribution: loguniform

    # For low-sigma expert:
    # sigma_min: 0.001
    # sigma_max: 1.0

    # For high-sigma expert:
    sigma_min: 1.0
    sigma_max: 300.0

  total_train_steps: 450000 # set according to your needs
  checkpoint_freq: 10000 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 10000 # how often to record the validation loss, measured in number of training steps
  validation_plot_variables: [fci06vis_t+1, fci63wv_t+1, fci105ir_t+1]

  optimizer:
    name: "adamw"
    lr: 5e-4
    betas: [0.9, 0.99]

  scheduler:
    name: "CosineAnnealingLR"

  clip_grad_norm: 1.0

  perf:
    fp_optimizations: fp32
    torch_compile: true

sampler:
  args:
    num_steps: 48
    # sample over the same noise range as used in training
    sigma_min: ${training.loss.sigma_min}
    sigma_max: ${training.loss.sigma_max}
