# Reference configuration for training StormCastCONUS-style diffusion
# forecasting models guided by low-resolution conditioning.


# Defaults
defaults:

  # Dataset
  - dataset/xarray # replace with your own if using a custom dataset

  # Model
  - model/reference_dit

  # Training
  - training/default

  # Sampler
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

dataset: # remove if using custom dataset
  # replace array names (hrrr, era5) and channels with your own (channels: null to use all channels)
  state_access_patterns: # the "state" (training target)
    hrrr: {channels: [t2m, u10, v10], time_steps: [1]}
  background_access_patterns: # the "background" (conditioning); {} for none
    hrrr: {channels: "${dataset.state_access_patterns.hrrr.channels}", time_steps: [0]}
    era5: {channels: null, time_steps: [1]}

training:
  loss:
    type: 'edm'
  total_train_steps: 450000 # set according to your needs
  checkpoint_freq: 10000 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 10000 # how often to record the validation loss, measured in number of training steps
  validation_plot_variables: [t2m_t+1, u10_t+1, v10_t+1] # state channels to plot during validation
  perf:
    fp_optimizations: amp-bf16
    torch_compile: true