# CorrDiff model config - corresponds to the "normal" model size of the CorrDiff
# recipe (examples/weather/corrdiff), used in the paper
# Residual Corrective Diffusion Modeling for Km-scale Atmospheric Downscaling
# (https://arxiv.org/abs/2309.15214).
#
# For new CorrDiff-type models, it is recommended to use reference_dit.yaml for a
# diffusion-only model with DiT, or reference_unet.yaml if a regression+diffusion
# U-Net is preferred.


# Model conditions
regression_conditions: ["background"] # list consisting of "background", "invariant"
diffusion_conditions: ["regression", "background"] # list consisting of "regression", "background", "invariant"

# Model hyperparameters
architecture: unet
hyperparameters:
  model_type: "SongUNetPosEmbd" # U-Net with a positional embedding grid concatenated to the input
  gridtype: "sinusoidal"
  N_grid_channels: 4
  embedding_type: "zero" # no noise level embedding, as in CorrDiff
  model_channels: 128
  channel_mult: [1, 2, 2, 2, 2]
  attn_resolutions: [28]

# Pretrained regression model
regression_weights: null # Path to the pretrained regression checkpoint, required if "regression" is in diffusion_conditions.
                         # Regression training saves it as <training.rundir>/checkpoints_regression/StormCastUNet.0.<step>.mdlus
