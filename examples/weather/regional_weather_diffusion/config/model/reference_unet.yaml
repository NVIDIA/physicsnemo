# Reference model config for U-Net. Use as the starting configuration for new model
# projects where a U-Net is preferred over DiT.


# Model conditions
regression_conditions: ["background", "invariant"] # list consisting of "background", "invariant"
diffusion_conditions: ["regression", "background", "invariant"] # list consisting of "regression", "background", "invariant"

# Model hyperparameters
architecture: unet
hyperparameters:
  additive_pos_embed: True
  channel_mult: [1, 2, 2]  # differs from SongUNet default
# Example overrides for architecture hyperparameters (uncomment to customize)
#  num_blocks: 2
#  model_channels: 128
#  attn_resolutions: [] # Internal resolutions within the U-Net to apply self-attention
#  bottleneck_attention: false
#  checkpoint_level: 0
#  additive_pos_embed: false # Whether or not to add an additive position embed after the first conv in the U-Net

# Pretrained regression model
regression_weights: null # Path to the pretrained regression checkpoint, required if "regression" is in diffusion_conditions.
                         # Regression training saves it as <training.rundir>/checkpoints_regression/StormCastUNet.0.<step>.mdlus
