# StormCast CONUS model config - corresponds to the model StormCastCONUS:
# https://nvidia.github.io/earth2studio/main/modules/generated/models/px/StormCastCONUS/
#
# For new StormCast-type models, it is recommended to use the better-optimized config
# of reference_dit.yaml instead of this one.


# Model conditions
diffusion_conditions: ["background", "invariant"]

# Model hyperparameters
architecture: "dit"
hyperparameters:
  depth: 16
  hidden_size: 768
  attn_kernel_size: 31
  num_heads: 16
  patch_size: 4
  use_nan_mask_tokens: false
