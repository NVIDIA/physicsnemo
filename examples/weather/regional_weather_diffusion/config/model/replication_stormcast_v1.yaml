# StormCast v1 model config - corresponds to the version in the paper
# Kilometer-Scale Convection Allowing Model Emulation using Generative Diffusion Modeling
# (https://arxiv.org/abs/2408.10958), available at
# https://nvidia.github.io/earth2studio/main/modules/generated/models/px/StormCast/
#
# For new StormCast-type models, it is recommended to use the diffusion transformer
# configuration from reference_dit.yaml, or reference_unet.yaml if a UNet is preferred,
# instead of this one.


# Model conditions
regression_conditions: ["background", "invariant"] # list consisting of "background", "invariant" (default from StormCast paper).
                                                    # The dataset's "background" tensor includes the previous HRRR timestep.
diffusion_conditions: ["regression", "invariant"] # list consisting of "regression", "background", "invariant" (default from StormCast paper)

# Model hyperparameters
architecture: unet
hyperparameters:
  model_type: "SongUNetPosEmbd" # Model class to use
  channel_mult: [1, 2, 2]  # differs from SongUNet default

# Pretrained regression model
regression_weights: null # Path to the pretrained regression checkpoint, required if "regression" is in diffusion_conditions.
                         # Regression training saves it as <training.rundir>/checkpoints_regression/StormCastUNet.0.<step>.mdlus
