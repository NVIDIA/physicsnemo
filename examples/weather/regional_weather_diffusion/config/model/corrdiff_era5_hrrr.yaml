# Defaults

# Diffusion transformer (DiT) of CorrDiff-ERA5-HRRR: 678M parameters,
# neighborhood attention with 2D rotary position embeddings, trained with
# x-prediction rectified flow matching (training.loss.type: flow_matching).
# These settings match the released checkpoint.

# Model name
model_name: 'diffusion'

architecture: dit

# Preconditioner: the times are multiplied by time_scale before the DiT
# timestep embedding, the network output is the prediction itself
preconditioner: time_scaled
time_scale: 999.0 # Flow-matching times in [0, 1] are multiplied by this

# Model conditions: pure downscaling, the low-resolution ERA5 fields (with the
# static fields appended by the dataset) condition the model
regression_conditions: []
diffusion_conditions: ["background"]

# Model hyperparameters
hyperparameters:
  hidden_size: 1152 # Number of channels in the transformer blocks
  depth: 28 # Number of transformer blocks
  num_heads: 18 # Number of attention heads
  patch_size: 2 # Size of the patches embedded as tokens
  attn_kernel_size: 31 # Neighborhood size of the attention, in tokens
  attention_backend: natten2d_rope # Neighborhood attention with 2D rotary position embeddings
  layernorm_backend: torch # Layer normalization backend of the blocks, "torch" or "apex"
  attn_kwargs:
    qk_norm: true # Normalize the attention queries and keys, stabilizes bf16 training
    norm_layer: apex # Apex LayerNorm keeps the bf16 dtype that NATTEN needs for queries, keys, and values
