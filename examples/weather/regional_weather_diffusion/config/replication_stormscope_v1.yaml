# Configuration for replicating the training of StormScope models with
# the original configuration: absolute positional embedding and no qk_norm.
# For new projects, reference_stormscope.yaml is recommended.


# Defaults
defaults:

  # Dataset
  - dataset/xarray  # replace with your own if using a custom dataset

  # Model
  - model/replication_stormscope_absposemb

  # Training
  - training/default

  # Sampler
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

dataset: # remove if using custom dataset
  state_access_patterns: # the "state" (training target)
    radiance:
      channels: [abi01c, abi02c, abi03c, abi07c, abi08c, abi09c, abi10c, abi13c] # for GOES-ABI
      #channels: ["fci04vis", "fci05vis", "fci06vis", "fci08vis", "fci09vis", "fci13nir", "fci16nir", "fci22nir", "fci38ir", "fci63wv", "fci73wv", "fci87ir", "fci97ir", "fci105ir", "fci123ir", "fci133ir"] # for MTG-FCI
      time_steps: [1]
  background_access_patterns: # the "background" (conditioning)
    radiance: {channels: "${dataset.state_access_patterns.radiance.channels}", time_steps: [-5, -4, -3, -2, -1, 0]}
  invariants_path: data/invariants.zarr # replace with your invariants file
  invariant_variables: ["lsm", "orography"]
  mask_variable: mask
  time_step_seconds: 600 # 10 min

training:
  loss:
    type: 'edm'
  total_train_steps: 450000 # set according to your needs
  checkpoint_freq: 10000 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 10000 # how often to record the validation loss, measured in number of training steps
  validation_plot_variables: [abi02c_t+1, abi08c_t+1, abi13c_t+1] # for GOES-ABI
  #validation_plot_variables: [fci06vis_t+1, fci63wv_t+1, fci105ir_t+1] # for MTG-FCI
  perf:
    fp_optimizations: fp32
    torch_compile: true
