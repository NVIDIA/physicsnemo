# Reference configuration for training StormScope-style diffusion
# nowcasting models.


# Defaults
defaults:

  # Dataset
  - dataset/xarray  # replace with your own if using a custom dataset

  # Model
  - model/reference_dit

  # Training
  - training/default

  # Sampler
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

dataset: # remove if using custom dataset
  # replace array name (radiance) and channels with your own (channels: null to use all channels)
  state_access_patterns: # the "state" (training target)
    radiance: {channels: null, time_steps: [1]}
  background_access_patterns: # the "background" (conditioning); {} for none
    radiance: {channels: "${dataset.state_access_patterns.radiance.channels}", time_steps: [-5, -4, -3, -2, -1, 0]}
  invariants_path: data/invariants.zarr # replace with your invariants file
  invariant_variables: ["elevation", "land_sea_mask"]
  mask_variable: mask # static mask in the invariants file, nonzero where valid (e.g. on the satellite disk)
  nan_mask: false # set to true to also mask out pixels that are NaN in the data
  time_step_seconds: 600 # 10 min

training:
  loss:
    type: 'edm'
  total_train_steps: 450000 # set according to your needs
  checkpoint_freq: 10000 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 10000 # how often to record the validation loss, measured in number of training steps
  validation_plot_variables: [] # state channels to plot during validation, e.g. [abi13c_t+1]
  perf:
    fp_optimizations: amp-bf16
    torch_compile: true