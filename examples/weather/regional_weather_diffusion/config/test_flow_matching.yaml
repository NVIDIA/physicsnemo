# Defaults

# Tiny DiT downscaling model trained with flow matching on mock data, used by
# test_training.py

# Defaults
defaults:

  # Dataset
  - dataset/mock

  # Model
  - model/corrdiff_era5_hrrr

  # Training
  - training/default

  # Sampler
  - sampler/rectified_flow

  # Hydra
  - hydra/default

  - _self_

training:
  num_data_workers: 1
  validation_plot_variables: ["state_0"]
  log_to_wandb: True
  wandb_mode: "offline"  # not using online logging while testing
  log_to_tensorboard: True

  print_progress_freq: 5 # How often to print progress, measured in number of training steps
  checkpoint_freq: 5 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 5 # how often to record the validation loss, measured in number of training steps
  batch_size: 1
  total_train_steps: 10

  optimizer:
    name: "adamw"
    betas: [0.9, 0.99]

  scheduler:
    name: null

  loss:
    type: 'flow_matching'
    prediction_type: 'x0'

sampler:
  args:
    num_steps: 2

dataset:
  num_samples: 20
  model_type: downscaling

model:
  hyperparameters:
    depth: 2
    hidden_size: 32
    num_heads: 1
    attn_kernel_size: 7
