# ERA5 -> HRRR downscaling with x-prediction rectified flow matching:
#   - noisy states x_t = (1 - t) x0 + t eps with t drawn uniformly from [0, 1]
#   - the DiT predicts the clean HRRR state x0, the loss is ||x0_hat - x0||^2
#   - trained on random 256 x 256 patches of the 1024 x 1792 HRRR domain

# Defaults
defaults:

  # Dataset
  - dataset/hrrr_era5

  # Model
  - model/dit

  # Training
  - training/default

  # Sampler
  - sampler/rectified_flow

  # Hydra
  - hydra/default

  - _self_
