# General inference config items
outdir: 'rundir' # Root path under which to save inference outputs
experiment_name: 'corrdiff-era5-hrrr-inference' # Name for the inference experiment being run
run_id: '0' # Unique identifier for the inference run
rundir: ${inference.outdir}/${inference.experiment_name}/${inference.run_id} # Path where experiment outputs will be saved
checkpoint: checkpoints/corrdiff_era5_hrrr.mdlus # Model weights; for a model you trained, <training.rundir>/checkpoints/TimeScaledModel.0.<step>.mdlus

# Sample selection
time: "2025-10-24T00:00:00" # Time to downscale (YYYY-MM-DDTHH:MM:SS), must be within dataset.time_range_valid
num_ensembles: 4 # Number of samples (ensemble members) to generate
seed: 0 # Random seed of the first sample, sample i uses seed + i

# I/O
output_variables: ["u10m", "v10m", "t2m", "mslp", "refc"] # State variables to save to disk (empty list == all channels saved)
plot_variables: ["u10m", "t2m", "refc"] # State variables to plot
