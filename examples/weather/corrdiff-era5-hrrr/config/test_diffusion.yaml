# Tiny model on mock data, used by test_training.py

# Defaults
defaults:

  # Dataset
  - dataset/mock

  # Model
  - model/dit

  # Training
  - training/default

  # Sampler
  - sampler/rectified_flow

  # Hydra
  - hydra/default

  - _self_

training:
  num_data_workers: 1
  validation_plot_variables: ["state_0"]
  log_to_tensorboard: True

  print_progress_freq: 5 # How often to print progress, measured in number of training steps
  checkpoint_freq: 5 # How often to save the checkpoints, measured in number of training steps
  validation_freq: 5 # How often to record the validation loss, measured in number of training steps
  validation_steps: 2
  batch_size: 2
  batch_size_per_gpu: 1
  total_train_steps: 10

  scheduler:
    lr_rampup_steps: 2

sampler:
  args:
    num_steps: 2

model:
  hyperparameters:
    hidden_size: 64
    depth: 2
    num_heads: 1
    attn_kernel_size: 7
