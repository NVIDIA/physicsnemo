name: hrrr_era5.HRRRERA5Dataset # Dataset class module and name, in any module in `datasets` folder

# Main dataset, see datasets/hrrr_era5.py for the expected layout
data_path: 'data' # Path to the dataset
years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025] # Years of data to load

# Temporal selection: data starts at the HRRR version change in 2018,
# missing samples are automatically excluded
time_range_train: ["2018-07-01T00:00:00", "2025-10-01T00:00:00"]
time_range_valid: ["2025-10-01T00:00:00", "2026-01-01T00:00:00"]

# Domain
crop_window: [[17, 1041], [3, 1795]] # [[y0, y1], [x0, x1]] window of the HRRR grid, 1024 x 1792 pixels
patch_shape: [256, 256] # Shape of the random training patches; null for the full domain

# Static fields appended to the background channels
invariant_variables: ["elev_mean", "elev_std", "lsm_mean"]

# Droppable inputs: during training, each listed ERA5 variable is independently
# replaced by its climatological mean with probability drop_prob. A presence
# flag per variable (1 = kept, 0 = dropped) is passed to the model with the
# scalar conditions, so the model can also run without these inputs.
drop_variables: ["tcwv", "sp"]
drop_prob: 0.5
