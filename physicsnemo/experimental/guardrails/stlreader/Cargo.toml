[package]
name = "stlreader"
version = "0.1.0"
edition = "2021"

[lib]
name = "stlreader"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
stl_io = "0.7"
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
