name: Research Paper Submission
description: Submit a paper that uses PhysicsNeMo for the research list
title: "[PAPER]: "
labels: ["research-paper", "? - Needs Triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping grow the [Research and Publications Using PhysicsNeMo](https://github.com/NVIDIA/physicsnemo/blob/main/docs/research.md) list!
        - Inclusion does not imply endorsement; submissions are reviewed before being added.
        - Authors may also request a correction or removal through this form.

  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: "DoMINO: A Decomposable Multi-scale Iterative Neural Operator ..."
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: arXiv / DOI link
      placeholder: "https://arxiv.org/abs/2501.13350"
    validations:
      required: true

  - type: textarea
    id: usage
    attributes:
      label: How PhysicsNeMo was used
      description: Briefly describe how PhysicsNeMo was used (which models, modules, or examples), and quote a sentence from the paper if possible.
    validations:
      required: true

  - type: input
    id: code_link
    attributes:
      label: Code link (if available)
      placeholder: "https://github.com/..."
    validations:
      required: false

  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: "CFD / CAE, PINNs / PDEs, weather, subsurface, ..."
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have searched the existing [research list](https://github.com/NVIDIA/physicsnemo/blob/main/docs/research.md) and this paper is not already included.
          required: true
