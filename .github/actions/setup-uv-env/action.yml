name: Setup uv environment
description: |
  Restore (or build) a deterministic Python virtual environment for CUDA
  CI jobs.  Implements two disjoint caches with distinct contracts (see
  .github/CACHE_CONTRACT.md for the full design):

    * uv download cache (~/.cache/uv) -- additive wheel store, keyed on
      the container/python/uv baseline.  Restored fail-open; missing
      cache only costs download time, never correctness.

    * venv cache (.venv) -- realized environment, keyed on the lockfile
      hash (lock + pyproject + extras).  Restored exact-match only; a
      partial match would silently violate the "lock-changed PR gets a
      fresh venv" contract.  On miss we wipe .venv and rebuild from the
      committed lockfile, accelerated by the uv download cache.

  Verification (.venv/bin/python -c "import torch; ...") and a hash-based
  lockfile-mutation guard run on BOTH the hit and miss paths so a
  drifted environment fails loudly before any test executes.
inputs:
  uv-cache-key-prefix:
    description: |
      Prefix for the uv download cache key.  Should encode container
      identity, CUDA version, Python version, and uv version -- anything
      whose change should invalidate the wheel store.
    required: true
  uv-cache-key-suffix:
    description: |
      Suffix for the uv download cache key.  Conventionally the literal
      string "latest" so the slot is overwritten in place via
      delete-before-save.
    required: true
  venv-cache-key-prefix:
    description: |
      Prefix for the venv cache key.  Should additionally encode the
      extras tag (e.g. cu12) so cu12 and cu13 builds do not collide.
    required: true
  venv-cache-key-suffix:
    description: |
      Deterministic suffix appended to the venv cache key prefix.
      Conventionally `hashFiles('uv.lock', 'pyproject.toml')` computed
      once per job and pinned via a job output so downstream jobs read
      back the exact same key.
    required: true
  extras:
    description: |
      Extras to activate when building the venv on cache miss
      (comma-separated, passed as repeated `--extra` flags).  Defaults
      to "cu12".  This MUST match the <extras> tag baked into
      venv-cache-key-prefix or the cache will lie about its contents.
    required: false
    default: "cu12"
outputs:
  uv_cache_hit:
    description: Whether the uv download cache had an exact key hit
    value: ${{ steps.restore-uv-cache.outputs.cache-hit }}
  venv_cache_hit:
    description: Whether the venv cache had an exact key hit
    value: ${{ steps.restore-venv-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # --- Pre-flight: snapshot lockfile state ------------------------------
    # actions/checkout downloads as a tarball when git is missing at
    # checkout time, so .git/ may not exist and `git diff` is unreliable.
    # Hash the committed lock + pyproject up front instead; we compare
    # the post-sync hashes against this snapshot to detect any mutation.
    - name: Snapshot lockfile hashes
      id: lock-snapshot
      shell: bash
      run: |
        set -euo pipefail
        for f in uv.lock pyproject.toml; do
          if [ ! -f "$f" ]; then
            echo "::error::$f not found in workspace ($(pwd))"
            exit 1
          fi
        done
        lock_sha=$(sha256sum uv.lock | awk '{print $1}')
        proj_sha=$(sha256sum pyproject.toml | awk '{print $1}')
        echo "lock_sha=${lock_sha}" >> "$GITHUB_OUTPUT"
        echo "proj_sha=${proj_sha}" >> "$GITHUB_OUTPUT"
        echo "uv.lock      sha256: ${lock_sha}"
        echo "pyproject.toml sha256: ${proj_sha}"

    # --- Restore phase ----------------------------------------------------
    # uv download cache: fail-open, no restore-keys fallback.  The prefix
    # already encodes the full container/python/uv identity, so a
    # near-match from a different baseline would be worse than a fresh
    # download.
    - name: Restore uv download cache
      id: restore-uv-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/uv
        key: ${{ inputs.uv-cache-key-prefix }}-${{ inputs.uv-cache-key-suffix }}

    # venv cache: exact match only.  A partial match would hand a Contract
    # 2 PR (lock changed) a stale venv that disagrees with the current
    # lockfile -- exactly the failure mode this design exists to forbid.
    - name: Restore venv cache (exact match only)
      id: restore-venv-cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: ${{ inputs.venv-cache-key-prefix }}-${{ inputs.venv-cache-key-suffix }}

    - name: Debug cache and environment context
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::setup-uv-env debug context"
        echo "uv cache key:       ${{ inputs.uv-cache-key-prefix }}-${{ inputs.uv-cache-key-suffix }}"
        echo "venv cache key:     ${{ inputs.venv-cache-key-prefix }}-${{ inputs.venv-cache-key-suffix }}"
        echo "uv cache exact hit: ${{ steps.restore-uv-cache.outputs.cache-hit }}"
        echo "venv cache hit:     ${{ steps.restore-venv-cache.outputs.cache-hit }}"
        echo "extras:             ${{ inputs.extras }}"
        echo "workspace:          $GITHUB_WORKSPACE"
        df -h
        echo "::endgroup::"

    # --- Build phase (Contract 2: lock changed, no venv hit) --------------
    # `rm -rf .venv` guarantees we are not building on top of any leftover
    # state -- belt and braces, since exact-match restore should never
    # leave a partial .venv anyway.
    #
    # UV_FROZEN=1 plus an explicit --frozen makes uv refuse to mutate the
    # lockfile.  UV_NO_SYNC=1 is set in the env block so any later
    # `uv run` in this action (or downstream consumer) cannot trigger an
    # implicit resync that would swap CUDA variants and rewrite uv.lock --
    # the exact bug that broke the previous nightly.
    - name: Clean-build venv on cache miss
      if: steps.restore-venv-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        UV_LINK_MODE: copy
        UV_FROZEN: "1"
        UV_NO_SYNC: "1"
      run: |
        set -euo pipefail
        echo "::group::clean-build venv (extras=${{ inputs.extras }})"
        rm -rf .venv
        # Build the --extra flags from the comma-separated input.
        extra_flags=()
        IFS=',' read -ra extras <<< "${{ inputs.extras }}"
        for e in "${extras[@]}"; do
          e_trimmed="$(echo "$e" | xargs)"
          if [ -n "$e_trimmed" ]; then
            extra_flags+=(--extra "$e_trimmed")
          fi
        done
        uv sync --frozen --group dev "${extra_flags[@]}"
        echo "::endgroup::"

    # --- Verification phase (runs on BOTH hit and miss) -------------------
    # Use .venv/bin/python directly so uv cannot, even theoretically,
    # trigger an implicit resync.  This is the read-only access pattern
    # downstream consumers should also follow.
    - name: Verify environment
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::verify environment"
        .venv/bin/python --version
        .venv/bin/python -c "import torch; print(f'torch={torch.__version__} cuda={torch.version.cuda}')"
        echo "::endgroup::"

    # Hard-fail if uv mutated the committed lockfile.  This catches the
    # historical bug class where an unintended `uv run` (without --frozen)
    # silently rewrites uv.lock to swap extras, so the venv cache ends up
    # saved under a key that downstream jobs cannot reproduce.
    - name: Assert lockfile was not mutated
      shell: bash
      env:
        EXPECTED_LOCK_SHA: ${{ steps.lock-snapshot.outputs.lock_sha }}
        EXPECTED_PROJ_SHA: ${{ steps.lock-snapshot.outputs.proj_sha }}
      run: |
        set -euo pipefail
        actual_lock=$(sha256sum uv.lock | awk '{print $1}')
        actual_proj=$(sha256sum pyproject.toml | awk '{print $1}')
        ok=true
        if [ "$actual_lock" != "$EXPECTED_LOCK_SHA" ]; then
          echo "::error::uv.lock was modified during environment setup."
          echo "::error::  expected sha256: ${EXPECTED_LOCK_SHA}"
          echo "::error::  actual   sha256: ${actual_lock}"
          ok=false
        fi
        if [ "$actual_proj" != "$EXPECTED_PROJ_SHA" ]; then
          echo "::error::pyproject.toml was modified during environment setup."
          echo "::error::  expected sha256: ${EXPECTED_PROJ_SHA}"
          echo "::error::  actual   sha256: ${actual_proj}"
          ok=false
        fi
        if ! $ok; then
          echo "::error::This usually means an unguarded uv sync or uv run resolved without --frozen."
          echo "::error::Check that UV_FROZEN=1 is set and no uv command in the action drops the --extra flags."
          exit 1
        fi

    - name: Report cache sizes
      shell: bash
      run: |
        echo "::group::cache sizes"
        echo "uv download cache (~/.cache/uv):"
        du -sh ~/.cache/uv 2>/dev/null || echo "  (not present)"
        echo ".venv:"
        du -sh .venv 2>/dev/null || echo "  (not present)"
        df -h
        echo "::endgroup::"
