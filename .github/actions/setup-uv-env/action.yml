name: Setup uv environment
description: Restore uv and venv caches, and run uv sync on cache miss
inputs:
  uv-cache-key-prefix:
    description: Prefix for uv package cache key
    required: true
  venv-cache-key-prefix:
    description: Prefix for virtual environment cache key
    required: true
  cache-key-suffix:
    description: Deterministic suffix appended to cache key prefixes
    required: true
outputs:
  uv_cache_hit:
    description: Whether uv package cache had an exact key hit
    value: ${{ steps.restore-uv-cache.outputs.cache-hit }}
  venv_cache_hit:
    description: Whether venv cache had an exact key hit
    value: ${{ steps.restore-venv-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore uv package cache
      id: restore-uv-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/uv
        key: ${{ inputs.uv-cache-key-prefix }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ inputs.uv-cache-key-prefix }}-

    - name: Restore venv cache
      id: restore-venv-cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: ${{ inputs.venv-cache-key-prefix }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ inputs.venv-cache-key-prefix }}-

    - name: Install base dependencies with uv (dev + cu13)
      if: steps.restore-venv-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        uv sync \
          --group dev \
          --extra cu13 \
          --preview-features extra-build-dependencies

    - name: Install GNN dependencies from pyproject extras
      if: steps.restore-venv-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        uv sync \
          --group dev \
          --extra cu13 \
          --extra gnns \
          --preview-features extra-build-dependencies

    - name: Force Hopper CUDA source builds for PyG extensions
      if: steps.restore-venv-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        export TORCH_CUDA_ARCH_LIST="9.0"
        export FORCE_CUDA=1
        export MAX_JOBS="$(nproc)"
        export UV_LINK_MODE=copy
        uv pip install "ninja" "wheel" "setuptools"
        uv run python -c "import torch; print(f'torch={torch.__version__} torch_cuda={torch.version.cuda}')"
        if command -v nvcc >/dev/null 2>&1; then
          nvcc --version
        else
          echo "nvcc not found on PATH"
        fi

        uv pip install --reinstall --no-deps --no-build-isolation --no-binary=torch_scatter torch_scatter
        uv pip install --reinstall --no-deps --no-build-isolation --no-binary=torch_sparse torch_sparse
        uv pip install --reinstall --no-deps --no-build-isolation --no-binary=torch_cluster torch_cluster

        uv pip install --reinstall --no-deps --no-build-isolation "git+https://github.com/pyg-team/pyg-lib.git@0.5.0"
