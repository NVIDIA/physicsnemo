name: Multi-GPU GitHub CI

on:
  schedule:
    # Run after the 02:00 UTC canonical nightly has refreshed shared caches.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      stream:
        description: Multi-GPU stream to run
        type: choice
        options:
          - both
          - dynamic
          - static
        default: both
        required: true
      publish-impact:
        description: Publish impact manifests (default-branch dispatches only)
        type: boolean
        default: false
        required: false
  push:
    # copy-pr-bot mirrors ready PRs into these trusted repository branches.
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: multigpu-ci-${{ github.ref }}
  # Cancel obsolete PR revisions, but never interrupt nightly cache publishers.
  cancel-in-progress: ${{ github.event_name == 'push' }}

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"
  EXTRAS_TAG: "cu12,natten-cu12,utils-extras,mesh-extras,nn-extras,model-extras,datapipes-extras,uq-extras,gnns,sym,transformer-engine-cu12"
  UV_CACHE_KEY_PREFIX: "uv-cache-nightly-cuda12.8.1-cudnn-devel-ubuntu24.04-py3.12-uv0.11.7-fullextras"
  JIT_CACHE_KEY: "jit-cache-cuda12.8.1-cudnn-devel-ubuntu24.04-py3.12-latest"
  JIT_CACHE_DIR: "/root/.cache/jit"
  IMPACT_CACHE_VERSION: "v1"
  # Two GPUs match the runner inventory already used by this repository.
  # Static records rank/skip totals; set both static repository variables to
  # exercise the cases that intentionally require four ranks when that pool
  # becomes available.
  MULTIGPU_DYNAMIC_NPROC: ${{ vars.MULTIGPU_DYNAMIC_NPROC || '2' }}
  MULTIGPU_STATIC_NPROC: ${{ vars.MULTIGPU_STATIC_NPROC || '2' }}
  MULTIGPU_DYNAMIC_RUNNER_PROFILE: ${{ vars.MULTIGPU_DYNAMIC_RUNNER || 'linux-amd64-gpu-h100-latest-2' }}
  MULTIGPU_STATIC_RUNNER_PROFILE: ${{ vars.MULTIGPU_STATIC_RUNNER || 'linux-amd64-gpu-h100-latest-2' }}
  UV_FROZEN: "1"
  UV_NO_SYNC: "1"
  PYVISTA_OFF_SCREEN: "true"

jobs:
  select:
    name: multi-GPU selection
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run_dynamic: ${{ steps.gate.outputs.run_dynamic }}
      run_static: ${{ steps.gate.outputs.run_static }}

    steps:
      - uses: actions/checkout@v5

      - name: Prepare isolated impact-cache paths
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          # Cache versions include path metadata, so restore with the same
          # relative paths publishers save. Clear PR-controlled contents first.
          rm -rf .multigpu-impact
          mkdir -p .multigpu-impact

      - name: Restore dynamic impact manifest
        id: restore_dynamic
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .multigpu-impact/multigpu-impact-dynamic.json
          key: multigpu-impact-dynamic-${{ env.IMPACT_CACHE_VERSION }}-latest

      - name: Restore static impact manifest
        id: restore_static
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .multigpu-impact/multigpu-impact-static.json
          key: multigpu-impact-static-${{ env.IMPACT_CACHE_VERSION }}-latest

      - name: Fetch pull-request metadata and files
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" =~ ^pull-request/([1-9][0-9]*)$ ]]; then
            pr_number="${BASH_REMATCH[1]}"
          else
            echo "::error::Unexpected PR mirror ref: $REF_NAME"
            exit 2
          fi
          gh api "repos/${REPOSITORY}/pulls/${pr_number}" \
            > "${RUNNER_TEMP}/multigpu-pr-before.json"
          gh api --paginate --slurp \
            "repos/${REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
            > "${RUNNER_TEMP}/multigpu-pr-files.json"
          # Re-read metadata so a source push during pagination cannot make
          # us select against a different diff than the mirrored checkout.
          gh api "repos/${REPOSITORY}/pulls/${pr_number}" \
            > "${RUNNER_TEMP}/multigpu-pr-after.json"

      - name: Fetch recent default-branch history for baseline comparison
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=512 origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Select multi-GPU streams
        id: gate
        env:
          DISPATCH_STREAM: ${{ inputs.stream || 'both' }}
          DYNAMIC_CACHE_HIT: ${{ steps.restore_dynamic.outputs.cache-hit }}
          STATIC_CACHE_HIT: ${{ steps.restore_static.outputs.cache-hit }}
        run: |
          set -euo pipefail
          dynamic_manifest="${RUNNER_TEMP}/missing-dynamic-impact.json"
          static_manifest="${RUNNER_TEMP}/missing-static-impact.json"
          if [ "$DYNAMIC_CACHE_HIT" = "true" ]; then
            dynamic_manifest=".multigpu-impact/multigpu-impact-dynamic.json"
          fi
          if [ "$STATIC_CACHE_HIT" = "true" ]; then
            static_manifest=".multigpu-impact/multigpu-impact-static.json"
          fi
          python3 .github/scripts/multigpu_ci.py \
            --repo-root "$GITHUB_WORKSPACE" \
            gate \
            --event-name "${GITHUB_EVENT_NAME}" \
            --ref-name "${GITHUB_REF_NAME}" \
            --dispatch-stream "$DISPATCH_STREAM" \
            --pr-json "${RUNNER_TEMP}/multigpu-pr-before.json" \
            --pr-after-json "${RUNNER_TEMP}/multigpu-pr-after.json" \
            --files-json "${RUNNER_TEMP}/multigpu-pr-files.json" \
            --expected-head-sha "$GITHUB_SHA" \
            --dynamic-nproc "$MULTIGPU_DYNAMIC_NPROC" \
            --static-nproc "$MULTIGPU_STATIC_NPROC" \
            --dynamic-runner-profile "$MULTIGPU_DYNAMIC_RUNNER_PROFILE" \
            --static-runner-profile "$MULTIGPU_STATIC_RUNNER_PROFILE" \
            --dynamic-manifest "$dynamic_manifest" \
            --static-manifest "$static_manifest" \
            --max-age-hours 72 \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

  multigpu_dynamic:
    name: multigpu-dynamic
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.run_dynamic != 'false') }}
    runs-on: ${{ vars.MULTIGPU_DYNAMIC_RUNNER || 'linux-amd64-gpu-h100-latest-2' }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    container:
      image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04
      options: --shm-size=2g

    steps:
      - uses: actions/checkout@v5
      - name: Run dynamic multi-GPU stream
        uses: ./.github/actions/run-multigpu-tests
        with:
          stream: dynamic
          nproc: ${{ env.MULTIGPU_DYNAMIC_NPROC }}
          runner-profile: ${{ env.MULTIGPU_DYNAMIC_RUNNER_PROFILE }}
          collect-impact: >-
            ${{ github.event_name == 'schedule' ||
                (github.event_name == 'workflow_dispatch' &&
                 inputs['publish-impact'] && github.ref_type == 'branch' &&
                 github.ref_name == github.event.repository.default_branch) }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          extras: ${{ env.EXTRAS_TAG }}
          uv-cache-key-prefix: ${{ env.UV_CACHE_KEY_PREFIX }}
          jit-cache-key: ${{ env.JIT_CACHE_KEY }}
          jit-cache-dir: ${{ env.JIT_CACHE_DIR }}
          hf-token: ${{ secrets.HF_CI_DATA_TOKEN }}

  multigpu_static:
    name: multigpu-static
    needs: select
    if: ${{ always() && !cancelled() && (needs.select.result != 'success' || needs.select.outputs.run_static != 'false') }}
    runs-on: ${{ vars.MULTIGPU_STATIC_RUNNER || 'linux-amd64-gpu-h100-latest-2' }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    container:
      image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04
      options: --shm-size=2g

    steps:
      - uses: actions/checkout@v5
      - name: Run static multi-GPU stream
        uses: ./.github/actions/run-multigpu-tests
        with:
          stream: static
          nproc: ${{ env.MULTIGPU_STATIC_NPROC }}
          runner-profile: ${{ env.MULTIGPU_STATIC_RUNNER_PROFILE }}
          collect-impact: >-
            ${{ github.event_name == 'schedule' ||
                (github.event_name == 'workflow_dispatch' &&
                 inputs['publish-impact'] && github.ref_type == 'branch' &&
                 github.ref_name == github.event.repository.default_branch) }}
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          extras: ${{ env.EXTRAS_TAG }}
          uv-cache-key-prefix: ${{ env.UV_CACHE_KEY_PREFIX }}
          jit-cache-key: ${{ env.JIT_CACHE_KEY }}
          jit-cache-dir: ${{ env.JIT_CACHE_DIR }}
          hf-token: ${{ secrets.HF_CI_DATA_TOKEN }}

  report_multigpu:
    name: report multi-GPU results
    needs: [multigpu_dynamic, multigpu_static]
    if: >-
      ${{ always() && !cancelled() &&
          (needs.multigpu_dynamic.result != 'skipped' ||
           needs.multigpu_static.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      - name: Check out repository for report annotations
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download dynamic JUnit artifact
        id: download_dynamic
        if: ${{ needs.multigpu_dynamic.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-multigpu-dynamic
          path: ${{ runner.temp }}/multigpu-junit/dynamic

      - name: Publish dynamic test report
        if: >-
          ${{ always() && steps.checkout.outcome == 'success' &&
              steps.download_dynamic.outcome == 'success' }}
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Multi-GPU dynamic Results
          path: ${{ runner.temp }}/multigpu-junit/dynamic/*.xml
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "false"

      - name: Download static JUnit artifact
        id: download_static
        if: ${{ needs.multigpu_static.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: junit-multigpu-static
          path: ${{ runner.temp }}/multigpu-junit/static

      - name: Publish static test report
        if: >-
          ${{ always() && steps.checkout.outcome == 'success' &&
              steps.download_static.outcome == 'success' }}
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: Multi-GPU static Results
          path: ${{ runner.temp }}/multigpu-junit/static/*.xml
          reporter: java-junit
          fail-on-error: "false"
          fail-on-empty: "false"

  publish_dynamic_impact:
    name: publish dynamic impact manifest
    needs: multigpu_dynamic
    if: >-
      ${{ !cancelled() && needs.multigpu_dynamic.result == 'success' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs['publish-impact'] &&
            github.ref_type == 'branch' &&
            github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Download dynamic impact manifest
        uses: actions/download-artifact@v4
        with:
          name: multigpu-impact-dynamic
          path: .multigpu-impact
      - name: Replace dynamic impact cache
        uses: ./.github/actions/replace-cache
        with:
          path: .multigpu-impact/multigpu-impact-dynamic.json
          key: multigpu-impact-dynamic-${{ env.IMPACT_CACHE_VERSION }}-latest
          description: dynamic multi-GPU impact manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish_static_impact:
    name: publish static impact manifest
    needs: multigpu_static
    if: >-
      ${{ !cancelled() && needs.multigpu_static.result == 'success' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && inputs['publish-impact'] &&
            github.ref_type == 'branch' &&
            github.ref_name == github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v5
      - name: Download static impact manifest
        uses: actions/download-artifact@v4
        with:
          name: multigpu-impact-static
          path: .multigpu-impact
      - name: Replace static impact cache
        uses: ./.github/actions/replace-cache
        with:
          path: .multigpu-impact/multigpu-impact-static.json
          key: multigpu-impact-static-${{ env.IMPACT_CACHE_VERSION }}-latest
          description: static multi-GPU impact manifest
          github-token: ${{ secrets.GITHUB_TOKEN }}
