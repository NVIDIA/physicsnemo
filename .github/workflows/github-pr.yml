# This CI runs on pull requests and uses testmon to skip tests
# that don't have changed dependencies based on the nightly cache.
# The tests run here will only use UV.
#
# ----------------------------------------------------------------------------
# Implements the PR consumer contract (see .github/CACHE_CONTRACT.md):
#
#   Contract 1 (no lock change):
#     venv cache exact-match hit from nightly -> use as-is.
#     testmon DB and coverage baseline restored from nightly.
#
#   Contract 2 (lock changed):
#     venv cache misses -> clean-build from lockfile, accelerated by the
#     nightly's uv download cache.
#     testmon/coverage fall back to nightly prefix -> best-effort.
# ----------------------------------------------------------------------------

# TO DO: THE COVERAGE LIMIT IS VERY LOW, BECAUSE THIS IS NOT USING GPU TESTS OR
# THE DATA-DRIVEN TESTS.  RAISE THIS UP AGAIN EVENTUALLY.

name: Pull Request Github CI
on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:
    # Allow manual triggering for debugging the CI.

permissions:
  contents: read
  actions: write
  checks: write

defaults:
  run:
    shell: bash

env:
  # ---- Container baseline identity ---------------------------------------
  # MUST match the nightly workflow so cache keys align.  See
  # .github/CACHE_CONTRACT.md for the full design.
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.7"
  CONTAINER_ID: "cuda12.8.1-cudnn-devel-ubuntu24.04"
  EXTRAS_TAG: "cu12"

  # ---- Cache key prefixes (shared with nightly) --------------------------
  UV_CACHE_KEY_PREFIX:   "uv-cache-nightly-cuda12.8.1-cudnn-devel-ubuntu24.04-py3.12-uv0.11.7"
  VENV_CACHE_KEY_PREFIX: "uv-env-nightly-cuda12.8.1-cudnn-devel-ubuntu24.04-py3.12-uv0.11.7-cu12"
  TESTMON_CACHE_KEY_PREFIX:  "testmon-nightly"
  COVERAGE_CACHE_KEY_PREFIX: "coverage-nightly"

  # ---- uv read-only defaults --------------------------------------------
  UV_FROZEN: "1"
  UV_NO_SYNC: "1"

  PYVISTA_OFF_SCREEN: "true"

jobs:
  # Stage 1: Restore (or rebuild) the environment
  #
  # Contract 1 PRs (no lock change):
  #   The venv cache key hashes uv.lock + pyproject.toml.  Because the PR
  #   didn't change those files, the hash equals what nightly saved ->
  #   exact-match hit, no sync needed.
  #
  # Contract 2 PRs (lock changed):
  #   Exact-match misses because the hash differs.  setup-uv-env
  #   clean-builds the venv from the committed lockfile, accelerated by
  #   the nightly's uv download cache (restored fail-open).
  build-environment:
    name: Build Environment
    runs-on: linux-amd64-cpu8
    container:
      image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04
    outputs:
      lockhash: ${{ steps.lockhash.outputs.hash }}
      venv_cache_hit: ${{ steps.setup-uv-env.outputs.venv_cache_hit }}

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap cuDNN CI container
      uses: ./.github/actions/bootstrap-cudnn-ci
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        uv-version: ${{ env.UV_VERSION }}

    - name: Compute lockfile hash
      id: lockhash
      run: |
        echo "hash=${{ hashFiles('uv.lock', 'pyproject.toml') }}" >> "$GITHUB_OUTPUT"
        echo "lockhash=${{ hashFiles('uv.lock', 'pyproject.toml') }}"

    - name: Setup uv environment from cache
      id: setup-uv-env
      uses: ./.github/actions/setup-uv-env
      with:
        uv-cache-key-prefix:   ${{ env.UV_CACHE_KEY_PREFIX }}
        uv-cache-key-suffix:   "latest"
        venv-cache-key-prefix: ${{ env.VENV_CACHE_KEY_PREFIX }}
        venv-cache-key-suffix: ${{ steps.lockhash.outputs.hash }}
        extras: ${{ env.EXTRAS_TAG }}

    - name: Report setup action outputs
      run: |
        echo "uv_cache_hit=${{ steps.setup-uv-env.outputs.uv_cache_hit }}"
        echo "venv_cache_hit=${{ steps.setup-uv-env.outputs.venv_cache_hit }}"

    # Contract 2 PRs need to save their freshly-built venv so the
    # downstream GPU jobs in this same workflow run can restore it.
    # Contract 1 PRs already have the nightly's cache; this save will
    # no-op (key already exists) which is correct.
    - name: Free disk space before caching
      if: steps.setup-uv-env.outputs.venv_cache_hit != 'true'
      run: |
        rm -rf ~/.cache/uv
        df -h

    - name: Save venv cache (Contract 2 path)
      if: steps.setup-uv-env.outputs.venv_cache_hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: ${{ env.VENV_CACHE_KEY_PREFIX }}-${{ steps.lockhash.outputs.hash }}

  # Stage 2: Run testmon tests
  testmon:
    name: Testmon
    needs: build-environment
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap cuDNN CI container
      uses: ./.github/actions/bootstrap-cudnn-ci
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        uv-version: ${{ env.UV_VERSION }}

    - name: Restore prebuilt environment cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: ${{ env.VENV_CACHE_KEY_PREFIX }}-${{ needs.build-environment.outputs.lockhash }}
        fail-on-cache-miss: true

    - name: Validate environment
      run: |
        set -euo pipefail
        .venv/bin/python --version
        .venv/bin/python -c "import torch; print(f'torch={torch.__version__} cuda={torch.version.cuda}')"

    # Restore the nightly testmon DB so testmon can skip unchanged tests.
    # Exact-match uses the same lockhash the nightly saved under.
    # For Contract 2 PRs (lock changed) the exact key will miss; the
    # prefix fallback gives the most recent nightly DB, which is still
    # useful (testmon handles stale DBs gracefully by re-running tests
    # whose dependency hashes differ).
    - name: Restore testmon database from nightly cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .testmondata
          .testmondata-shm
          .testmondata-wal
        key: ${{ env.TESTMON_CACHE_KEY_PREFIX }}-${{ needs.build-environment.outputs.lockhash }}
        restore-keys: |
          ${{ env.TESTMON_CACHE_KEY_PREFIX }}-

    - name: Run core tests (with testmon)
      run: |
        uv run --no-sync python -m pytest --testmon --ignore-glob="*docs*" --ignore-glob="*examples*"

  # Stage 3: Run coverage tests and upload artifacts
  coverage:
    name: Coverage
    needs: build-environment
    runs-on: linux-amd64-gpu-h100-latest-1
    container:
      image: nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap cuDNN CI container
      uses: ./.github/actions/bootstrap-cudnn-ci
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        uv-version: ${{ env.UV_VERSION }}

    - name: Restore prebuilt environment cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: ${{ env.VENV_CACHE_KEY_PREFIX }}-${{ needs.build-environment.outputs.lockhash }}
        fail-on-cache-miss: true

    - name: Validate environment
      run: |
        set -euo pipefail
        .venv/bin/python --version
        .venv/bin/python -c "import torch; print(f'torch={torch.__version__} cuda={torch.version.cuda}')"

    - name: Restore testmon database from nightly cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .testmondata
          .testmondata-shm
          .testmondata-wal
        key: ${{ env.TESTMON_CACHE_KEY_PREFIX }}-${{ needs.build-environment.outputs.lockhash }}
        restore-keys: |
          ${{ env.TESTMON_CACHE_KEY_PREFIX }}-

    - name: Restore nightly coverage baseline from cache
      id: cache-coverage-restore
      uses: actions/cache/restore@v4
      with:
        path: .coverage*
        key: ${{ env.COVERAGE_CACHE_KEY_PREFIX }}-${{ needs.build-environment.outputs.lockhash }}
        restore-keys: |
          ${{ env.COVERAGE_CACHE_KEY_PREFIX }}-

    - name: Run core tests for coverage report (testmon-selected)
      run: |
        uv run --no-sync coverage run --rcfile='test/coverage.pytest.rc' -m pytest --testmon --ignore-glob="*docs*" --ignore-glob="*examples*"

    - name: Run doc tests (testmon not supported for doctests)
      run: |
        uv run --no-sync coverage run --rcfile='test/coverage.docstring.rc' -m pytest --doctest-modules physicsnemo/ --ignore-glob="*internal*" --ignore-glob="*experimental*"

    - name: Merge coverage reports
      run: |
        echo "Coverage files to combine:"
        ls -la .coverage* 2>/dev/null || echo "No coverage files found"

        uv run --no-sync coverage combine

        uv run --no-sync coverage report --show-missing --omit="*test*" --omit="*internal*" --omit="*experimental*" --fail-under=45
        uv run --no-sync coverage html
        uv run --no-sync coverage xml -o coverage.xml

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-pr
        path: htmlcov/
        retention-days: 7
