name: Install CI

on:
  push:
    branches: [main, "*-rc"]
  pull_request:
    branches: [main, "*-rc"]
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:  # Allows manual triggering from GitHub UI
  merge_group:

jobs:
  test-pip:
    name: Test with pip (Python ${{ matrix.python-version }}, OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Only run pip tests for scheduled and manual dispatch jobs, Linux only
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with pip
      run: |
        python -m pip install --upgrade pip
        # pip 25.1+ supports dependency groups natively via --group
        pip install -e . --group dev

    - name: Run tests
      run: pytest test/

  test-uv:
    name: Test with uv (Python ${{ matrix.python-version }}, OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Matrix varies by event type:
        #   PR/merge_group:  ubuntu × 3.12 only (1 job)
        #   push:            ubuntu × all Python versions (4 jobs)
        #   schedule/manual: ubuntu × all versions + arm/mac/win × 3.14 (7 jobs)
        include: >-
          ${{
            (github.event_name == 'pull_request' || github.event_name == 'merge_group')
              && fromJSON('[
                {"os": "ubuntu-latest", "python-version": "3.12"}
              ]')
            || github.event_name == 'push'
              && fromJSON('[
                {"os": "ubuntu-latest", "python-version": "3.11"},
                {"os": "ubuntu-latest", "python-version": "3.12"},
                {"os": "ubuntu-latest", "python-version": "3.13"},
                {"os": "ubuntu-latest", "python-version": "3.14"}
              ]')
            || fromJSON('[
                {"os": "ubuntu-latest",    "python-version": "3.11"},
                {"os": "ubuntu-latest",    "python-version": "3.12"},
                {"os": "ubuntu-latest",    "python-version": "3.13"},
                {"os": "ubuntu-latest",    "python-version": "3.14"},
                {"os": "ubuntu-24.04-arm", "python-version": "3.14"},
                {"os": "macos-latest",     "python-version": "3.14"},
                {"os": "windows-latest",   "python-version": "3.14"}
              ]')
          }}

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      id: setup_python
      with:
        python-version: ${{ matrix.python-version }}

    # Set up MSVC compiler on Windows (does nothing on Linux/macOS)
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Install uv
      uses: nick-fields/retry@v3
      # uv download can be flaky. Wrapping in a retry.
      with:
        timeout_minutes: 5
        max_attempts: 3
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        command: >-
          ${{
            runner.os == 'Windows'
              && 'irm https://astral.sh/uv/install.ps1 | iex;
                  echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append'
              || 'curl -LsSf https://astral.sh/uv/install.sh | sh &&
                  echo "$HOME/.cargo/bin" >> $GITHUB_PATH'
          }}

    - name: Install package with uv
      env:
        UV_PYTHON: ${{ steps.setup_python.outputs.python-path }}
        UV_PYTHON_DOWNLOADS: never
      run: uv sync --frozen --group dev

    - name: Verify Python version
      env:
        UV_PYTHON: ${{ steps.setup_python.outputs.python-path }}
        UV_PYTHON_DOWNLOADS: never
      run: >-
        uv run --no-sync python -c
        "import sys; expected=tuple(map(int, '${{ matrix.python-version }}'.split('.')));
        actual=sys.version_info[:2]; assert actual == expected,
        f'Expected Python {expected}, got {sys.version}'"

    - name: Run tests
      env:
        UV_PYTHON: ${{ steps.setup_python.outputs.python-path }}
        UV_PYTHON_DOWNLOADS: never
      run: uv run --no-sync pytest test/
